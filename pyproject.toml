# pyproject.toml — Nakagawa Recomp Python tooling configuration
# Covers tools/ (codegen pipeline, analysis, testing)

[project]
name = "nakagawa-recomp-tools"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
# Dev tooling: generated Clang compilation database for IDE/clangd (see nk_manager.ps1).
# Version-bounded for reproducible developer environments (0.10.x is the current line).
dependencies = [
    "compiledb>=0.10.7,<1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = false

# Lint only the hand-written Python; skip generated/third-party
src = ["tools"]
extend-exclude = ["build", "third_party", "interface", "__pycache__"]

[tool.ruff.lint]
# Baseline correctness gate for the legacy tooling. Broader style/modernization
# families currently produce hundreds of pre-existing findings; expand this list
# incrementally as touched files are cleaned instead of mass-rewriting codegen.
select = [
    "E9",   # syntax/runtime parser failures
    "F",    # Pyflakes (undefined names, unused imports/variables, duplicate keys)
    "B",    # flake8-bugbear (common bugs and design issues)
]

[tool.ruff.lint.per-file-ignores]
# Legacy codegen and fixture generators are kept on baseline correctness checks
# to avoid mass rewrites on untouched/generated files.
"tools/codegen.py" = ["F541", "B023"]
"fixtures/**" = ["F401", "F841", "B007"]


[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "third_party/"]
