name: Provenance attestation (merge group)

# Observation-only provenance check for merge-queue groups.
#
# Admission: this is a new workflow path. tools/provenance_ledger.py classifies
# .github/workflows/ as implementation-grade (HARDENED_ADMISSION_PREFIXES), so the
# maintainer admits it before the controls are adopted. It is not a required check.
#
# Why workflow_run and not merge_group: a merge_group run is defined by the group
# commit's own workflow files, so a queued change could replace this check's body.
# This workflow_run route runs the default branch's copy of this file, the same trust
# root as provenance-attestation.yml. The CI run that completes for the group is only a
# wake-up signal: the group commit is read as data and never checked out.
#
# The job name must not contain the reserved required-check context. The verifier
# refuses any other workflow that names it (tools/provenance_attest_verify.py
# _ci_findings), and LiveRepositoryTests requires it in exactly one workflow.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# One group, one run. A group commit is unique per queue entry, so one group's
# observation never cancels another's.
concurrency:
  group: provenance-merge-group-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  attest-merge-group:
    name: Provenance attestation (merge group)
    # Only merge groups of the default branch. GitHub produces the merge_group event for
    # queue entries alone, and the head repository must be this one.
    if: >-
      ${{ github.event.workflow_run.event == 'merge_group' &&
          startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/') &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"

      # Data only. The queue ref is fetched into the trusted checkout and must name
      # exactly the group commit the CI run ran on. The queue deletes its ref when the
      # entry resolves; a missing or moved ref fails this observation closed.
      - name: Fetch the group commit objects without checking them out
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "${HEAD_BRANCH}" in
            gh-readonly-queue/*) ;;
            *) echo "workflow_run is not a merge queue group" >&2; exit 1 ;;
          esac
          case "${HEAD_BRANCH}" in
            *[!A-Za-z0-9._/-]*) echo "queue ref name has unexpected characters" >&2; exit 1 ;;
          esac
          case "${HEAD_SHA}" in
            [0-9a-f]*) [ "${#HEAD_SHA}" -eq 40 ] || { echo "sha malformed" >&2; exit 1; } ;;
            *) echo "sha malformed" >&2; exit 1 ;;
          esac
          git fetch --no-tags --no-recurse-submodules --quiet origin \
            "+refs/heads/${HEAD_BRANCH}:refs/candidate/merge"
          fetched="$(git rev-parse refs/candidate/merge)"
          if [ "${fetched}" != "${HEAD_SHA}" ]; then
            echo "queue ref moved: CI ran ${HEAD_SHA}, ref is now ${fetched}" >&2
            exit 1
          fi
          echo "group commit ${fetched} fetched as data only (never checked out)"

      # The base is the merge base of the group with the default branch as it is now.
      # That commit is always on the trusted branch. The group's own parent
      # (merge_group.base_sha) may be an earlier group that never landed, so it is not
      # the verdict base.
      - name: Resolve the verdict base
        id: base
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "${HEAD_SHA}" HEAD)"
          case "${base_sha}" in
            [0-9a-f]*) [ "${#base_sha}" -eq 40 ] || { echo "base sha malformed" >&2; exit 1; } ;;
            *) echo "base sha malformed" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "${base_sha}" HEAD
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "verdict base ${base_sha} (ancestor of the default branch)"

      - name: Fetch the trusted detailed implementation ledger
        id: authority
        env:
          GH_TOKEN: ${{ secrets.PROVENANCE_AUTHORITY_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_REPO: Jstar269/nakagawa-recomp-history-private
          TRUSTED_REF: main
          TRUSTED_LEDGER_PATH: docs/provenance/IMPLEMENTATION_PROVENANCE.json
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROVENANCE_AUTHORITY_TOKEN is not configured for this repository." >&2
            echo "The trusted provenance authority cannot be read. Failing closed." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/trusted"
          # Resolve the authority revision ONCE and read the ledger AT that revision.
          authority_sha="$(gh api "repos/${TRUSTED_REPO}/commits/${TRUSTED_REF}" --jq .sha)"
          case "${authority_sha}" in
            [0-9a-f]*) [ "${#authority_sha}" -eq 40 ] || { echo "authority sha malformed" >&2; exit 1; } ;;
            *) echo "authority sha malformed" >&2; exit 1 ;;
          esac
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${TRUSTED_REPO}/contents/${TRUSTED_LEDGER_PATH}?ref=${authority_sha}" \
            > "${RUNNER_TEMP}/trusted/IMPLEMENTATION_PROVENANCE.json"
          echo "trusted authority ${TRUSTED_REPO}@${authority_sha}"
          echo "authority_sha=${authority_sha}" >> "${GITHUB_OUTPUT}"

          # A candidate policy is still untrusted data. When its bytes differ from the
          # verdict base policy, the private authority must supply both the blessed bytes
          # and a document binding the exact delta. The verifier repeats every digest and
          # semantic check; these outputs only select its external inputs.
          # New deltas bind both candidate and base digests. Prefer that
          # nested layout and keep the existing flat layout as a fallback.
          base_policy_sha="$(git show "${BASE_SHA}:assets/public_source_profile.json" | sha256sum | cut -d' ' -f1)"
          candidate_policy_sha="$(git show "${HEAD_SHA}:assets/public_source_profile.json" | sha256sum | cut -d' ' -f1)"
          for value in "${base_policy_sha}" "${candidate_policy_sha}"; do
            case "${value}" in
              [0-9a-f]*) [ "${#value}" -eq 64 ] || { echo "policy sha malformed" >&2; exit 1; } ;;
              *) echo "policy sha malformed" >&2; exit 1 ;;
            esac
          done
          echo "base policy sha256 ${base_policy_sha}"
          echo "candidate policy sha256 ${candidate_policy_sha}"
          if [ "${base_policy_sha}" != "${candidate_policy_sha}" ]; then
            nested_policy_dir="docs/provenance/policy-deltas/${candidate_policy_sha}/${base_policy_sha}"
            flat_policy_dir="docs/provenance/policy-deltas/${candidate_policy_sha}"
            if gh api \
              -H "Accept: application/vnd.github.raw" \
              "repos/${TRUSTED_REPO}/contents/${nested_policy_dir}/candidate-policy.json?ref=${authority_sha}" \
              > "${RUNNER_TEMP}/trusted/candidate-policy.json" && \
              gh api \
                -H "Accept: application/vnd.github.raw" \
                "repos/${TRUSTED_REPO}/contents/${nested_policy_dir}/policy-delta-authority.json?ref=${authority_sha}" \
                > "${RUNNER_TEMP}/trusted/policy-delta-authority.json" && \
              test -s "${RUNNER_TEMP}/trusted/candidate-policy.json" && \
              test -s "${RUNNER_TEMP}/trusted/policy-delta-authority.json"; then
              policy_dir="${nested_policy_dir}"
            else
              policy_dir="${flat_policy_dir}"
              gh api \
                -H "Accept: application/vnd.github.raw" \
                "repos/${TRUSTED_REPO}/contents/${policy_dir}/candidate-policy.json?ref=${authority_sha}" \
                > "${RUNNER_TEMP}/trusted/candidate-policy.json"
              gh api \
                -H "Accept: application/vnd.github.raw" \
                "repos/${TRUSTED_REPO}/contents/${policy_dir}/policy-delta-authority.json?ref=${authority_sha}" \
                > "${RUNNER_TEMP}/trusted/policy-delta-authority.json"
            fi
            test -s "${RUNNER_TEMP}/trusted/candidate-policy.json"
            test -s "${RUNNER_TEMP}/trusted/policy-delta-authority.json"
            echo "policy delta authority materialized from ${policy_dir}"
            echo "trusted_candidate_policy=${RUNNER_TEMP}/trusted/candidate-policy.json" >> "${GITHUB_OUTPUT}"
            echo "policy_delta_authority=${RUNNER_TEMP}/trusted/policy-delta-authority.json" >> "${GITHUB_OUTPUT}"
          else
            echo "candidate policy equals trusted base policy; no policy delta authority required"
          fi

      - name: Generate the trusted base public baseline from the authority
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted" "${RUNNER_TEMP}/baseline-scratch"
          baseline="${RUNNER_TEMP}/trusted/public-provenance-baseline.json"
          if ! python tools/provenance_attest_verify.py \
            --repo "${GITHUB_WORKSPACE}" \
            --base "${BASE_SHA}" \
            --trusted-ledger "${RUNNER_TEMP}/trusted/IMPLEMENTATION_PROVENANCE.json" \
            --workdir "${RUNNER_TEMP}/baseline-scratch" \
            --emit-authority-baseline "${baseline}"; then
            echo "trusted base public provenance baseline could not be generated" >&2
            exit 1
          fi
          test -s "${baseline}"

      - name: Generate and verify ephemeral provenance controls
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
          TRUSTED_CANDIDATE_POLICY: ${{ steps.authority.outputs.trusted_candidate_policy }}
          POLICY_DELTA_AUTHORITY: ${{ steps.authority.outputs.policy_delta_authority }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/verify"
          # Existing exact path authority is sufficient for normal progress. Exact
          # immutable SHAs from the event, never branch names.
          policy_args=()
          if [ -n "${TRUSTED_CANDIDATE_POLICY:-}" ] || [ -n "${POLICY_DELTA_AUTHORITY:-}" ]; then
            if [ -z "${TRUSTED_CANDIDATE_POLICY:-}" ] || [ -z "${POLICY_DELTA_AUTHORITY:-}" ]; then
              echo "policy delta authority outputs must be paired" >&2
              exit 1
            fi
            policy_args+=(
              --trusted-candidate-policy "${TRUSTED_CANDIDATE_POLICY}"
              --policy-delta-authority "${POLICY_DELTA_AUTHORITY}"
            )
          fi
          python tools/provenance_attest_verify.py \
            --repo "${GITHUB_WORKSPACE}" \
            --candidate "${HEAD_SHA}" \
            --base "${BASE_SHA}" \
            --require-immutable-revisions \
            --authority-revision "${AUTHORITY_SHA}" \
            --trusted-ledger "${RUNNER_TEMP}/trusted/IMPLEMENTATION_PROVENANCE.json" \
            --ephemeral \
            --trusted-baseline "${RUNNER_TEMP}/trusted/public-provenance-baseline.json" \
            --output-dir "${RUNNER_TEMP}/verify" \
            --json "${RUNNER_TEMP}/verify/verdict.json" \
            "${policy_args[@]}" \
            | tee "${RUNNER_TEMP}/verify/report.txt"

      - name: Explain the verdict in plain words
        if: always()
        run: |
          set -euo pipefail
          if [ -s "${RUNNER_TEMP}/verify/verdict.json" ]; then
            python tools/provenance_attest_verify.py \
              --explain-verdict "${RUNNER_TEMP}/verify/verdict.json" \
              >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '### Provenance (merge group): no verdict was produced' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish the public report
        if: always()
        env:
          AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
        run: |
          set -euo pipefail
          {
            echo '### Provenance attestation for a merge group'
            echo
            echo '> **OBSERVATION MODE, not enforcement.** This check is not a required status check.'
            echo
            echo "Trusted authority: ${AUTHORITY_SHA:-unavailable}"
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/verify/report.txt" 2>/dev/null || echo 'the verifier did not produce a report'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
