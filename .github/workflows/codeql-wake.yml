name: CodeQL wake

# Signal only. It lets the trusted CodeQL workflow (codeql.yml) start when a pull request
# head is pushed, instead of after the whole CI workflow has finished.
#
# This run is a pull_request run: it executes this file as it appears in the pull request's
# merge commit, so the file is candidate-controlled. It has no secrets for fork pull requests,
# requests no permissions, checks out nothing and runs no repository code. Its result is never
# read as evidence: codeql.yml resolves the exact pull request from GitHub's API, refuses any
# head that no longer matches, and only the trusted upload produces the required "CodeQL" check.
# Do not add steps that build, test, read repository files or use secrets; codeql.yml's
# workflow_run name ("CodeQL wake") must match this workflow's name exactly.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codeql-wake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  wake:
    name: CodeQL wake signal
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Signal the trusted CodeQL workflow
        run: echo "CodeQL wake signal for the pull request head"
