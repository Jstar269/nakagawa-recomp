# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Dependency Review'
on:
  pull_request:
    branches: [ "main" ]
  # Merge-queue groups (see ci.yml). A merge group has no pull_request payload, so
  # the step below passes base-ref and head-ref from the group. On pull_request runs
  # those expressions are empty, which the action reads as unset.
  merge_group:
    types: [checks_requested]
    branches: [ "main" ]

# If using a dependency submission action in this workflow this permission will need to be set to:
#
# permissions:
#   contents: write
#
# https://docs.github.com/en/enterprise-cloud@latest/code-security/supply-chain-security/understanding-your-software-supply-chain/using-the-dependency-submission-api
# Decision (S-19): `comment-summary-in-pr` is deliberately not used, so the
# workflow needs no pull-requests scope at all. Findings surface through the
# check run/annotations, which only require contents: read.
permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # See https://github.com/actions/dependency-review-action#configuration-options for all available options.
        # The pinned v5.0.0 reads both refs from the merge_group payload only when
        # neither input is set, and fails if only one is set (src/git-refs.ts). Passing
        # both is therefore the explicit form. Empty values on pull_request runs are
        # unset inputs (src/config.ts getOptionalInput), so pull_request behaviour is
        # unchanged.
        with:
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}
