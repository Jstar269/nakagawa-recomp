name: CI

on:
  # Pull-request events that can carry a new head: opened (the first head),
  # synchronize (new commits), reopened. Draft status does not suppress
  # substantive gates (tools/ci_paths.py exports allow_substantive
  # independently of draft), so a draft head is already fully validated and
  # needs no transition to become so.
  #
  # The status transitions are deliberately NOT listed. ready_for_review and
  # converted_to_draft never change the head, so they could only re-run the
  # matrix over a tree that was already validated - and, because concurrency
  # cancels in progress, a draft -> ready transition used to cancel the very
  # run it then duplicated. A new head is still covered by synchronize.
  pull_request:
    types: [opened, synchronize, reopened]
  # Feature-branch commits are covered by pull_request.  A normal main push
  # keeps only the compact smoke gate; workflow changes are the exception and
  # request the full validation needed to prove the new CI itself.
  push:
    branches: [main]
  # Keep a nightly full-tier run alongside the PR tier. The case selection is
  # controlled by NK_TEST_TIER in python_tools; the rest of CI remains unchanged.
  schedule:
    - cron: "17 3 * * *"
  # Manual and scheduled runs execute the complete matrix, including main_smoke:
  # tools/ci_paths.py forces full validation for both event types regardless of
  # changed paths, and ci_required treats every emitted gate as required. There
  # is deliberately no input to narrow a manual run.
  workflow_dispatch:
  # Merge-queue groups. GitHub builds a group commit (the trunk plus the queued
  # pull requests ahead of this one, plus this one) and asks for checks on that
  # exact commit. A group is a ref in this repository, created only after a
  # write-access maintainer enqueues a reviewed pull request. It gets the same
  # complete matrix as a manual run and is never path-gated, so every required
  # check reports on the group commit. The classifier forces it
  # (tools/ci_paths.py FULL_MATRIX_EVENTS). Inert until a merge queue rule exists.
  merge_group:
    types: [checks_requested]

concurrency:
  # A new commit supersedes an in-flight run for the same PR/ref.  This is also
  # intentionally shared by draft and ready events so stale work cannot consume
  # a runner after the PR advances.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      python_tools: ${{ steps.paths.outputs.python_tools }}
      native_runtime: ${{ steps.paths.outputs.native_runtime }}
      build_system: ${{ steps.paths.outputs.build_system }}
      manager_powershell: ${{ steps.paths.outputs.manager_powershell }}
      title_manifest: ${{ steps.paths.outputs.title_manifest }}
      workflow_ci: ${{ steps.paths.outputs.workflow_ci }}
      dependency_metadata: ${{ steps.paths.outputs.dependency_metadata }}
      security_publication: ${{ steps.paths.outputs.security_publication }}
      run_markdown: ${{ steps.paths.outputs.run_markdown }}
      run_python: ${{ steps.paths.outputs.run_python }}
      python_scope: ${{ steps.paths.outputs.python_scope }}
      python_num_shards: ${{ steps.paths.outputs.python_num_shards }}
      python_shards: ${{ steps.paths.outputs.python_shards }}
      run_native: ${{ steps.paths.outputs.run_native }}
      run_windows: ${{ steps.paths.outputs.run_windows }}
      run_main_smoke: ${{ steps.paths.outputs.run_main_smoke }}
      allow_substantive: ${{ steps.paths.outputs.allow_substantive }}
      draft: ${{ steps.paths.outputs.draft }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python tools/ci_paths.py --github-output "$GITHUB_OUTPUT"

  hygiene:
    name: Hygiene and security
    runs-on: ubuntu-26.04
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Betterleaks' git mode is the history gate; a shallow checkout would
          # silently reduce it to a current-commit scan.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip
          cache-dependency-path: |
            .pre-commit-config.yaml
            .github/workflows/ci.yml

      - name: Install pre-commit
        shell: bash
        run: |
          # Exact CPython 3.15.1 / Ubuntu 26.04 x86_64 bootstrap closure. PyYAML
          # As of 2026-10-23, PyYAML 6.0.3 has no cp315 wheel, so build its
          # hashed sdist with pinned tools.
          cat > "$RUNNER_TEMP/pre-commit-build-requirements.txt" <<'LOCK'
          Cython==3.3.0 \
              --hash=sha256:9b24b5c8cd536946b62086fcafee6d5509d3f549f72d553d2336af87ffbe0da1
          setuptools==84.2.1 \
              --hash=sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          wheel==0.48.0 \
              --hash=sha256:3217dcc807155e45db462d7ef2431f5ddda0d7273b700d05a67b271ceb1287ab
          LOCK
          python -m pip install --disable-pip-version-check --require-hashes \
            -r "$RUNNER_TEMP/pre-commit-build-requirements.txt"
          cat > "$RUNNER_TEMP/pre-commit-requirements.txt" <<'LOCK'
          cfgv==3.5.0 \
              --hash=sha256:a8dc6b26ad22ff227d2634a65cb388215ce6cc96bbcc5cfde7641ae87e8dacc0
          distlib==0.4.4 \
              --hash=sha256:cf09d55b1e85a89576b036aeb71550bfd68320f3f21761ca329eadadad918638
          filelock==4.2.4 \
              --hash=sha256:301241438c57936ef93f4243a94f2559022268bfcf9b375a9a72eb0f8db8358e
          identify==2.6.20 \
              --hash=sha256:6a16b69b93187244e0548cbfd25b3e4a6f9a7a2ad784625c3bec2b8d27b81aaa
          nodeenv==1.11.0 \
              --hash=sha256:edaa16e6c14d7cf395d75d4bbd5a26390f4dc06501a33b4e76282b02cc688a25
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          platformdirs==4.13.5 \
              --hash=sha256:53d3ec4280b815c1e0b02edad7f9ee8fda1ba9c0865dd9c2e6e63849ce82fc1e
          pre-commit==4.6.2 \
              --hash=sha256:e2dde9a75d3bce11bd3831c26d134df00a2803c1d818be6a0383c3dcda25dc4e
          PyYAML==6.0.3 \
              --hash=sha256:d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
          python-discovery==1.6.4 \
              --hash=sha256:530179cc51a1816d512b15635b3dc931295ae12efb183783ad31190a5d425d2b
          virtualenv==21.14.11 \
              --hash=sha256:b319f8590a84e5de5f8f2c803ecd2237e9bc0ffa7c1e875e3169c107cecb7454
          LOCK
          python -m pip install --disable-pip-version-check --no-build-isolation --no-binary=PyYAML --require-hashes -r "$RUNNER_TEMP/pre-commit-requirements.txt"

      - name: Run shared all-files checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Enforce tracked-tree reference ratchet
        run: python tools/tree_lint.py --check

      - name: Locate the pinned Betterleaks binary
        shell: bash
        run: |
          set -euo pipefail
          # pre-commit uses the system Go toolchain when the runner provides one
          # and otherwise creates a versioned golangenv-* environment.  Discover
          # either form instead of assuming the fallback environment name.
          betterleaks_bin="$(find "${PRE_COMMIT_HOME:-$HOME/.cache/pre-commit}" -type f -path '*/golangenv-*/bin/betterleaks' -print -quit)"
          test -n "$betterleaks_bin"
          echo "BETTERLEAKS_BIN=$betterleaks_bin" >> "$GITHUB_ENV"

      - name: Scan reachable sanitized Git history with Betterleaks
        shell: bash
        run: |
          set -euo pipefail
          "$BETTERLEAKS_BIN" git . --redact --verbose

      - name: Run Betterleaks synthetic canaries
        shell: bash
        run: python tools/betterleaks_canary.py --betterleaks "$BETTERLEAKS_BIN"

  markdown:
    name: Markdown validation
    runs-on: ubuntu-26.04
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.run_markdown == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"

      - name: Lint repository Markdown
        run: npx --yes markdownlint-cli2@0.24.0

  # Public-export candidate audit (#293/#294), in its own job so it overlaps the all-files
  # hygiene checks instead of running after them (#735 item 5). It is a separate required
  # result: ci_required fails unless it succeeds, and every gate that waited for hygiene
  # also waits for it. The job runs on every event and gates no path, because publication
  # integrity must never be path-dependent (tools/test_ci_paths.py).
  public_export:
    name: Public export candidate audit
    runs-on: ubuntu-26.04
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      # #293/#294: represent the release-export candidate path in hosted CI.
      # One invocation runs the publication gates, generates the public-safe
      # candidate, and runs the exhaustive candidate-tree audit against the
      # staging bytes. The audit requires the release-controlled trusted ledger
      # (human-only input), so without it the export MUST fail closed with
      # PROVENANCE_UNVERIFIED and never promote a candidate (#293 immutability).
      # This step asserts exactly that named boundary.
      - name: Exercise public-export generation and candidate audit
        if: >-
          ${{ needs.classify.outputs.security_publication == 'true' ||
              github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          export_dir="${RUNNER_TEMP:?}/public-export-candidate"
          set +e
          output="$(python tools/build_public_export.py --export-dir "$export_dir" --public-safe-profile 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "export cleared without the trusted ledger; the candidate audit must fail closed" >&2
            exit 1
          fi
          if ! grep -q "PROVENANCE_UNVERIFIED" <<<"$output"; then
            echo "export failed for a reason other than the named fail-closed candidate audit" >&2
            exit 1
          fi
          if [ -e "$export_dir" ]; then
            echo "an uncleared candidate must never occupy the requested export path (#293)" >&2
            exit 1
          fi

  profile_zero_fixture:
    name: Profile-zero fixture build
    runs-on: ubuntu-26.04
    # The profile-zero guest (fixtures/profile_zero/main.c) is built here from source with
    # the PSPDEV distribution pinned by assets/upstream/pspdev.lock.json and checked
    # byte-for-byte against the committed fixtures/profile_zero/prebuilt/SHA256SUMS, so the
    # repository stores no generated executable (#1100, OpenSSF OSPS-QA-05.01). The Python
    # and Windows route jobs download the verified bytes as an artifact.
    needs: [classify]
    if: >-
      ${{ always() && needs.classify.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          (needs.classify.outputs.run_python == 'true' ||
           needs.classify.outputs.run_windows == 'true') }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSPDEV from the checked-in lock
        run: |
          read -r PSPDEV_URL PSPDEV_SHA256 < <(python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("assets/upstream/pspdev.lock.json").read_text())
          evidence = json.loads(Path("assets/upstream/pspdev.evidence.json").read_text())
          distribution = lock["distribution"]
          archive = evidence["archive"]
          if distribution["release"] != evidence["release"]:
              raise SystemExit("PSPDEV release disagrees with its evidence")
          expected = distribution["archive_sha256"]
          if archive["local_sha256"] != expected or archive["github_asset_digest"] != "sha256:" + expected:
              raise SystemExit("PSPDEV archive digest disagrees with the checked-in lock")
          print(archive["download_url"], expected)
          PY
          )
          echo "PSPDEV_URL=$PSPDEV_URL" >> "$GITHUB_ENV"
          echo "PSPDEV_SHA256=$PSPDEV_SHA256" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/pspdev.tar.gz"
          curl --fail --location --retry 3 "$PSPDEV_URL" --output "$archive"
          printf '%s  %s\n' "$PSPDEV_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pspdev-unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pspdev-unpacked"
          psp_gcc=$(find "$RUNNER_TEMP/pspdev-unpacked" -path '*/bin/psp-gcc' -print -quit)
          if [[ -z "$psp_gcc" ]]; then
            echo "locked PSPDEV archive did not contain bin/psp-gcc" >&2
            exit 1
          fi
          psp_root=${psp_gcc%/bin/psp-gcc}
          test -x "$psp_root/bin/psp-prxgen"
          sudo mkdir -p /usr/local/pspdev
          sudo cp -a "$psp_root"/. /usr/local/pspdev/
          test -x /usr/local/pspdev/bin/psp-gcc
          test -x /usr/local/pspdev/bin/psp-prxgen
          echo "/usr/local/pspdev/bin" >> "$GITHUB_PATH"
          echo "PSPDEV=/usr/local/pspdev" >> "$GITHUB_ENV"

      - name: Build the profile-zero fixture and check its pinned digests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/profile-zero"
          mkdir -p "$out"
          make --no-print-directory             -f "$PWD/fixtures/profile_zero/Makefile"             -C "$out"             VPATH="$PWD/fixtures/profile_zero"             TARGET=profile_zero_guest             EBOOT.PBP
          cp "$out/EBOOT.PBP" "$out/profile_zero_guest.prx" fixtures/profile_zero/prebuilt/
          (cd fixtures/profile_zero/prebuilt && sha256sum --check --strict SHA256SUMS)

      - name: Upload the verified fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-zero-fixture
          path: |
            fixtures/profile_zero/prebuilt/EBOOT.PBP
            fixtures/profile_zero/prebuilt/profile_zero_guest.prx
          if-no-files-found: error
          retention-days: 7

      - name: Gate profile-zero imports on HLE review status
        # #341: every NID the verified guest imports that routes to a dedicated `unreviewed`
        # handler must be listed in PROFILE_ZERO_UNREVIEWED_IMPORTS (tools/hle_registry_meta.py),
        # and every entry there must still be imported and unreviewed, so the list only shrinks.
        # The step follows the upload, so a failing gate still leaves the bytes to inspect.
        run: >-
          python3 tools/hle_manifest.py --out "$RUNNER_TEMP/hle_manifest.json"
          --imports fixtures/profile_zero/prebuilt/profile_zero_guest.prx
          --check-profile-zero-imports

  python_tools:
    name: Python tooling gates
    runs-on: ubuntu-24.04
    env:
      NK_TEST_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}
    # id-token: write lets the coverage upload authenticate to Codecov with the
    # job's OIDC identity (use_oidc: true) instead of a stored repository token.
    # It is not a publication permission: contents stays read.
    permissions:
      contents: read
      id-token: write
    # Waits for classify and the public-export audit, not hygiene: hygiene runs beside it
    # and ci_required still requires its result (docs/CI.md, "Hygiene beside the substantive gates").
    needs: [classify, public_export, profile_zero_fixture]
    # The suite is ~10 minutes serially. Four runners split the test files with
    # tools/ci_test_shards.py: a deterministic longest-first bin packing over the
    # measured per-module durations in tools/ci_test_weights.json (#693). Every
    # file runs exactly once across the shards, shards never share a working
    # tree, and modules that mutate tracked state never share a shard.
    # needs.python_tools.result is the aggregate of all shards, so ci_required is
    # unchanged. The shard list comes from the classifier: four shards over every
    # module, or -- when a recipe-only Makefile edit is the only reason to run
    # Python (#702) -- two shards over the modules that can observe that edit.
    strategy:
      fail-fast: false
      matrix:
        # The fallback only keeps the expression parseable when classify produced no
        # outputs; the job's own condition skips it in that case.
        shard: ${{ fromJSON(needs.classify.outputs.python_shards || '[0, 1, 2, 3]') }}
    if: >-
      ${{ always() && needs.classify.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.profile_zero_fixture.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          needs.classify.outputs.run_python == 'true' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the profile-zero fixture built from source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-zero-fixture
          path: fixtures/profile_zero/prebuilt

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/requirements-lock.txt

      - name: Install Python tooling dependencies
        # The hashed lock installs the complete tool closure (Ruff included for
        # SBOM completeness); this job does not invoke Ruff. The hygiene job's
        # pre-commit hook is the only Ruff runner, and the pin test keeps both
        # versions equal.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements-lock.txt
          # The checkout itself is not installed: the tests import from tools/, and
          # building it would fetch an unhashed setuptools (Scorecard PinnedDependencies).

      - name: >-
          Run Python unit tests (shard ${{ matrix.shard }} of
          ${{ needs.classify.outputs.python_num_shards }}, ${{ needs.classify.outputs.python_scope }})
        # Same files and sys.path as `python -m unittest discover -s tools -p "test_*.py"`.
        env:
          SHARD: ${{ matrix.shard }}
          NUM_SHARDS: ${{ needs.classify.outputs.python_num_shards }}
          PYTHON_SCOPE: ${{ needs.classify.outputs.python_scope }}
        # The list is captured before use so a failing planner stops the step: a
        # process substitution would hide its exit status, and unittest given no
        # module names falls back to discovery from the repository root.
        #
        # The same modules run under coverage, so the gate is unchanged: coverage
        # records what ran and exits with unittest's own status. `--parallel-mode`
        # keeps a shard's data separate until the combine below, and `--source`
        # plus the pyproject.toml omit list keep test modules out of the report.
        # A shard's number still has to be a non-zero exit: coverage never turns a
        # failing test into a passing step.
        run: |
          set -euo pipefail
          listing="$(python tools/ci_test_shards.py --shard "$SHARD" --num-shards "$NUM_SHARDS" --select "$PYTHON_SCOPE")"
          mapfile -t mods <<<"$listing"
          if [ "${#mods[@]}" -eq 0 ] || [ -z "${mods[0]}" ]; then
            echo "shard $SHARD received no test modules" >&2
            exit 1
          fi
          echo "shard $SHARD: ${#mods[@]} test files"
          test_log="$RUNNER_TEMP/python-tools-shard-$SHARD.log"
          set +e
          PYTHONPATH=tools python -m coverage run --parallel-mode --source=tools \
            -m unittest -v "${mods[@]}" 2>&1 | tee "$test_log"
          test_status=$?
          set -e
          skip_summary="$(PYTHONPATH=tools python -c 'from pathlib import Path; import sys; from ci_test_shards import skip_prefix_summary; print(skip_prefix_summary(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")))' "$test_log")"
          printf '%s\n' "$skip_summary" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          python -m coverage combine
          python -m coverage xml -o coverage-python.xml

      # Informational only: `fail_ci_if_error: false` and the Codecov status checks
      # are non-blocking (codecov.yml), so an upload or Codecov outage never fails
      # the Python gate. Each shard uploads its own partial report under the same
      # `python` flag, which Codecov merges for the commit.
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-python.xml
          flags: python
          name: python-shard-${{ matrix.shard }}
          fail_ci_if_error: false

  native_tools:
    name: Native and translation gates
    # Ubuntu 26.04 no longer publishes the gcc-mipsel-linux-gnu package that
    # this translation gate installs; keep the cross-compiler job on 24.04.
    runs-on: ubuntu-24.04
    # id-token: write exists only for the Codecov OIDC upload below; contents
    # stays read, as everywhere else in this workflow.
    permissions:
      contents: read
      id-token: write
    # Not gated on hygiene (docs/CI.md, "Hygiene beside the substantive gates").
    needs: [classify, public_export]
    if: >-
      ${{ always() && needs.classify.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          needs.classify.outputs.run_native == 'true' }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      # The runner's Ubuntu mirror is sometimes very slow rather than stalled (2026-10-23: 43.6 kB/s,
      # 39 minutes for 103 MB; then one package per ~7 minutes), so timeouts alone do not help. The
      # downloaded .deb files are cached between runs (packages only, never repository objects), and
      # a failed or slow attempt moves to the primary Ubuntu archive before retrying.
      - name: Restore the native apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-native-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-native-ubuntu-24.04-

      - name: Install native test dependencies
        timeout-minutes: 30
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' "Dir::Cache::Archives \"$archives\";" \
            'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "apt install attempt $((attempt - 1)) failed; switching to the primary Ubuntu archive" >&2
              # The hosted image's sources read mirror+file:/etc/apt/apt-mirrors.txt; put the primary
              # archive first in that list (and in any plain URI), keeping Azure as a fallback.
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' 'http://azure.archive.ubuntu.com/ubuntu/' \
                  | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              fi
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            fi
            # Both halves are capped per attempt so a slow mirror cannot spend the whole step budget
            # before the fallback runs: 3 minutes for the index update, 8 for the install.
            if sudo timeout 180 apt-get update && sudo timeout 480 apt-get install -y build-essential cmake curl gcc-mipsel-linux-gnu \
                git libc6-dev-i386 libvulkan-dev \
                libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
                libxkbcommon-dev libx11-dev libxrandr-dev libxss-dev libxtst-dev \
                mesa-vulkan-drivers ninja-build pkg-config vulkan-tools \
                vulkan-validationlayers xauth xvfb; then
              # The cache action runs as the runner user; make the root-owned .deb files readable.
              sudo rm -rf "$archives/partial" "$archives/lock"
              sudo chmod -R a+rX "$archives"
              exit 0
            fi
            sleep 10
          done
          exit 1

      # The pinned SDL3 install is cached under an exact key: the pinned version and
      # commit, the gcc and cmake that build it, and this workflow file (which holds
      # the configure flags). Only the SDL3 install is cached, never repository
      # objects. A hit restores the staged install instead of rebuilding it; the
      # install and pkg-config checks below run on both paths.
      - name: Key the pinned SDL3 install
        id: sdl3-key
        run: |
          SDL3_VERSION=3.4.18
          SDL3_COMMIT=829a65d769d935c4852f8159e964312c0957260a
          {
            echo "SDL3_VERSION=$SDL3_VERSION"
            echo "SDL3_COMMIT=$SDL3_COMMIT"
          } >> "$GITHUB_ENV"
          workflow_hash="$(sha256sum .github/workflows/ci.yml | cut -c1-16)"
          gcc_version="$(gcc -dumpfullversion)"
          cmake_version="$(cmake --version | sed -n 1p | awk '{print $3}')"
          echo "key=sdl3-$SDL3_VERSION-$SDL3_COMMIT-gcc$gcc_version-cmake$cmake_version-$workflow_hash" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned SDL3 install
        id: sdl3-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3-stage
          key: ${{ steps.sdl3-key.outputs.key }}

      - name: Build pinned SDL3 for headless Linux runtime
        # Build the pinned SDL release directly so CI uses the documented version.
        # Runs only on a cache miss. DESTDIR stages the install so the cache holds
        # exactly the files the install step copies into /usr/local.
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$RUNNER_TEMP/SDL" fetch --depth 1 origin "$SDL3_COMMIT"
          git -C "$RUNNER_TEMP/SDL" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_INSTALL_TESTS=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_VULKAN=ON -DSDL_X11=ON
          cmake --build "$RUNNER_TEMP/SDL/build" --parallel 2
          rm -rf "$RUNNER_TEMP/sdl3-stage"
          DESTDIR="$RUNNER_TEMP/sdl3-stage" cmake --install "$RUNNER_TEMP/SDL/build"

      - name: Install the pinned SDL3 into the Linux prefix
        run: |
          test -d "$RUNNER_TEMP/sdl3-stage/usr/local" || {
            echo "pinned SDL3 install is missing from ${RUNNER_TEMP}/sdl3-stage" >&2
            exit 1
          }
          sudo cp -a "$RUNNER_TEMP/sdl3-stage/usr/local/." /usr/local/
          sudo ldconfig
          # A mistyped but valid commit must fail here, not leave the docs claiming the pin.
          test "$(pkg-config --modversion sdl3)" = "$SDL3_VERSION"

      # SDL3_ttf has its own staged install cache. The exact SDL3_ttf and SDL3
      # commits, toolchain versions, and workflow hash key the cache; only the
      # installed files are cached, and the version and shaping backend are
      # checked after installation on both cache paths.
      - name: Key the pinned SDL3_ttf install
        id: sdl3-ttf-key
        run: |
          SDL3_TTF_VERSION=3.2.2
          SDL3_TTF_COMMIT=a1ce3670aec736ecbf0936c43f2f0cc53aa61e5b
          {
            echo "SDL3_TTF_VERSION=$SDL3_TTF_VERSION"
            echo "SDL3_TTF_COMMIT=$SDL3_TTF_COMMIT"
          } >> "$GITHUB_ENV"
          workflow_hash="$(sha256sum .github/workflows/ci.yml | cut -c1-16)"
          gcc_version="$(gcc -dumpfullversion)"
          cmake_version="$(cmake --version | sed -n 1p | awk '{print $3}')"
          echo "key=sdl3-ttf-$SDL3_TTF_VERSION-$SDL3_TTF_COMMIT-sdl3-$SDL3_VERSION-$SDL3_COMMIT-gcc$gcc_version-cmake$cmake_version-$workflow_hash" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned SDL3_ttf install
        id: sdl3-ttf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3-ttf-stage
          key: ${{ steps.sdl3-ttf-key.outputs.key }}

      - name: Build pinned SDL3_ttf with vendored FreeType and HarfBuzz
        if: steps.sdl3-ttf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/SDL_ttf"
          git -C "$RUNNER_TEMP/SDL_ttf" remote add origin https://github.com/libsdl-org/SDL_ttf.git
          git -C "$RUNNER_TEMP/SDL_ttf" fetch --depth 1 origin "$SDL3_TTF_COMMIT"
          git -C "$RUNNER_TEMP/SDL_ttf" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/SDL_ttf" submodule update --init --depth 1
          cmake -S "$RUNNER_TEMP/SDL_ttf" -B "$RUNNER_TEMP/SDL_ttf/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_PREFIX_PATH=/usr/local -DBUILD_SHARED_LIBS=ON \
            -DSDLTTF_INSTALL=ON -DSDLTTF_SAMPLES=OFF -DSDLTTF_STRICT=ON \
            -DSDLTTF_VENDORED=ON -DSDLTTF_HARFBUZZ=ON \
            2>&1 | tee "$RUNNER_TEMP/sdl3-ttf-configure.log"
          grep -Fq 'Using vendored freetype library' "$RUNNER_TEMP/sdl3-ttf-configure.log"
          grep -Fq 'Using vendored harfbuzz library' "$RUNNER_TEMP/sdl3-ttf-configure.log"
          cmake --build "$RUNNER_TEMP/SDL_ttf/build" --parallel 2
          rm -rf "$RUNNER_TEMP/sdl3-ttf-stage"
          DESTDIR="$RUNNER_TEMP/sdl3-ttf-stage" cmake --install "$RUNNER_TEMP/SDL_ttf/build"

      - name: Install and verify pinned SDL3_ttf and shaping libraries
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/sdl3-ttf-stage/usr/local" || {
            echo "pinned SDL3_ttf install is missing from ${RUNNER_TEMP}/sdl3-ttf-stage" >&2
            exit 1
          }
          sudo cp -a "$RUNNER_TEMP/sdl3-ttf-stage/usr/local/." /usr/local/
          sudo ldconfig
          ttf_version="$(pkg-config --modversion sdl3-ttf)"
          test "$ttf_version" = "$SDL3_TTF_VERSION"
          cat > "$RUNNER_TEMP/sdl3-ttf-features.c" <<'EOF'
          #include <SDL3/SDL.h>
          #include <SDL3_ttf/SDL_ttf.h>
          #include <stdio.h>

          int main(void)
          {
              int ft_major = 0, ft_minor = 0, ft_patch = 0;
              int hb_major = 0, hb_minor = 0, hb_patch = 0;
              if (!SDL_Init(0)) {
                  fprintf(stderr, "SDL_Init failed: %s\n", SDL_GetError());
                  return 2;
              }
              if (!TTF_Init()) {
                  fprintf(stderr, "TTF_Init failed: %s\n", SDL_GetError());
                  SDL_Quit();
                  return 2;
              }
              TTF_GetFreeTypeVersion(&ft_major, &ft_minor, &ft_patch);
              TTF_GetHarfBuzzVersion(&hb_major, &hb_minor, &hb_patch);
              printf("FreeType %d.%d.%d; HarfBuzz %d.%d.%d (enabled)\n",
                     ft_major, ft_minor, ft_patch, hb_major, hb_minor, hb_patch);
              TTF_Quit();
              SDL_Quit();
              return ft_major > 0 && hb_major > 0 ? 0 : 1;
          }
          EOF
          cc $(pkg-config --cflags sdl3-ttf) "$RUNNER_TEMP/sdl3-ttf-features.c" \
            -o "$RUNNER_TEMP/sdl3-ttf-features" $(pkg-config --libs sdl3-ttf)
          printf 'SDL3_ttf %s; ' "$ttf_version"
          "$RUNNER_TEMP/sdl3-ttf-features"

      - name: Build and run the vendored FFmpeg H.264 media selftest
        # Exercise the pinned, vendored FFmpeg H.264 subset (src/rt/h264_ffmpeg_sub, no system
        # FFmpeg installed), including guest-VRAM coherence, explicit backend selection,
        # native-format reporting, and the source-authored final-AU fixture. Use an isolated build
        # root so non-FFmpeg objects from earlier steps cannot be reused.
        run: make CC=gcc H264_FFMPEG=1 BUILD_ROOT="$RUNNER_TEMP/ffmpeg-h264-build" psmf-media-selftest

      - name: Install PSPDEV from the checked-in lock
        run: |
          read -r PSPDEV_URL PSPDEV_SHA256 < <(python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("assets/upstream/pspdev.lock.json").read_text())
          evidence = json.loads(Path("assets/upstream/pspdev.evidence.json").read_text())
          distribution = lock["distribution"]
          archive = evidence["archive"]
          if distribution["release"] != evidence["release"]:
              raise SystemExit("PSPDEV release disagrees with its evidence")
          expected = distribution["archive_sha256"]
          if archive["local_sha256"] != expected or archive["github_asset_digest"] != "sha256:" + expected:
              raise SystemExit("PSPDEV archive digest disagrees with the checked-in lock")
          print(archive["download_url"], expected)
          PY
          )
          echo "PSPDEV_URL=$PSPDEV_URL" >> "$GITHUB_ENV"
          echo "PSPDEV_SHA256=$PSPDEV_SHA256" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/pspdev.tar.gz"
          curl --fail --location --retry 3 "$PSPDEV_URL" --output "$archive"
          printf '%s  %s\n' "$PSPDEV_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pspdev-unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pspdev-unpacked"
          psp_gcc=$(find "$RUNNER_TEMP/pspdev-unpacked" -path '*/bin/psp-gcc' -print -quit)
          if [[ -z "$psp_gcc" ]]; then
            echo "locked PSPDEV archive did not contain bin/psp-gcc" >&2
            exit 1
          fi
          psp_root=${psp_gcc%/bin/psp-gcc}
          test -x "$psp_root/bin/psp-prxgen"
          sudo mkdir -p /usr/local/pspdev
          sudo cp -a "$psp_root"/. /usr/local/pspdev/
          test -x /usr/local/pspdev/bin/psp-gcc
          test -x /usr/local/pspdev/bin/psp-prxgen
          echo "/usr/local/pspdev/bin" >> "$GITHUB_PATH"
          echo "PSPDEV=/usr/local/pspdev" >> "$GITHUB_ENV"

      - name: Run import-coverage and fake-success audit gate
        # Public gate for issue #71: manifest extraction from src/rt/hle.c,
        # alias/waiver balance, classification-baseline drift, and synthetic
        # malformed-ELF fixtures. Requires no game inputs.
        run: python tools/import_audit_gate.py

      - name: Run provenance record and disposition gap check
        # #355: ratchets disposition gaps for upstream-derived production paths.
        run: python tools/provenance_record_gap.py --check

      - name: Compile host-neutral runtime objects on Linux
        run: make GAME_NAME=ci BUILD_DIR=build/portable-check CC=gcc portable-core-objects

      - name: Check 32-bit format specifier portability across portable core
        # libc6-dev-i386 (installed above) supplies the 32-bit C library headers for the
        # syntax-only -m32 build that gives this LP64 runner a 32-bit long; gcc-multilib
        # would do too but conflicts with the MIPS cross compiler this job installs.
        run: python tools/format_portability_check.py

      - name: Create build directory
        run: mkdir -p build

      - name: Run native core test suite (hostile parsers, catalog, launch resolution, POSIX process)
        run: make CC=gcc native-core-tests

      # Coverage measurement (informational). A second, isolated build of the same
      # suite with gcov instrumentation: the gate above keeps running unprofiled,
      # and nothing here can make it pass or fail. The base flags come from the
      # Makefile's own compiler-info, so the measured build uses exactly the
      # default build configuration with only `--coverage` appended to CFLAGS and
      # LDFLAGS (its targets that compile through those variables are measured;
      # see docs/CI.md, "Coverage").
      - name: Measure native core C statement coverage
        run: |
          set -euo pipefail
          coverage_build="$RUNNER_TEMP/native-core-coverage"
          # compiler-info prints the resolved CFLAGS, so the measured build keeps the
          # default configuration. Its -DSR_BUILD_DIR is dropped because the Makefile
          # re-derives that define from BUILD_DIR itself: passing it too redefines the
          # macro, which the -Werror selftests reject.
          base_cflags="$(make --no-print-directory CC=gcc GAME_NAME=ci \
            BUILD_DIR="$coverage_build" compiler-info \
            | sed -n 's/^CFLAGS=//p' \
            | sed 's/-DSR_BUILD_DIR="[^"]*"//')"
          test -n "$base_cflags"
          make --no-print-directory CC=gcc GAME_NAME=ci BUILD_DIR="$coverage_build" \
            CFLAGS="$base_cflags --coverage" LDFLAGS="--coverage" native-core-tests

          # gcov opens each object's recorded source path (src/rt/...) relative to its
          # working directory, so it runs here at the repository root. Run from the build
          # directory, as the action's gcov plugin does, it cannot open any source and
          # writes header-only reports that Codecov rejects as unusable. One gcov run per
          # object keeps each report whole: given several objects that share a source,
          # gcov 13 appends their line records into one file. -r keeps repository-relative
          # sources only (no system headers or generated fixtures), and the selftests' own
          # sources are dropped so the number describes the runtime they exercise.
          shopt -s nullglob
          gcov_dir="$RUNNER_TEMP/native-core-gcov"
          mkdir -p "$gcov_dir"
          for gcno in "$coverage_build"/*.gcno; do
            obj="$(basename "$gcno" .gcno)"
            gcov -p -b -r "$gcno" > /dev/null
            for report in *.gcov; do
              mv -- "$report" "$gcov_dir/$obj##$report"
            done
          done
          { grep -l -m1 -E '^ +-: +0:Source:.*_selftest\.c$' "$gcov_dir"/*.gcov || true; } \
            | xargs -r rm -f --
          reports=("$gcov_dir"/*.gcov)
          test "${#reports[@]}" -gt 0
          echo "C coverage: ${#reports[@]} gcov reports"

      # Informational only: the C number never gates a merge (codecov.yml). The reports
      # are already generated above, so the action only uploads them (plugins: noop).
      - name: Upload C coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ${{ runner.temp }}/native-core-gcov
          root_dir: ${{ github.workspace }}
          plugins: noop
          flags: c
          name: c-native-core
          fail_ci_if_error: false

      # Compile ge.c with its optional front-end attribution path enabled. Use a
      # fresh object directory so the normal unprofiled ge.o cannot satisfy the
      # target without compiling the requested configuration.
      - name: Compile GE frontend profiling mode
        run: |
          build_dir="$RUNNER_TEMP/ge-frontend-profile"
          mkdir -p "$build_dir"
          make --no-print-directory CC=gcc BUILD_DIR="$build_dir" GE_FRONTEND_PROFILE=1 "$build_dir/ge.o"

      - name: Run host present pacing selftest (links SDL3)
        run: make CC=gcc gui-present-selftest

      # tests/native/test_player_ui.py forces SDL's dummy video and software
      # render drivers for every player it spawns, so no step env is needed.
      - name: Run native player UI regressions headlessly
        run: make CC=gcc player-ui-regressions

      - name: Run Linux native player UI tests headlessly
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software make CC=gcc player-ui-tests

      - name: Verify lavapipe and run GPU capture selftest
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$lvp_icd" || {
            echo "mesa-vulkan-drivers did not install a lavapipe ICD" >&2
            exit 1
          }
          export VK_ICD_FILENAMES="$lvp_icd"
          vulkaninfo --summary | tee "$RUNNER_TEMP/vulkan-summary.txt"
          grep -qi llvmpipe "$RUNNER_TEMP/vulkan-summary.txt"
          xvfb-run -a -s "-screen 0 1280x800x24" env SDL_VIDEODRIVER=x11 \
            make CC=gcc gpu-capture-selftest

      - name: Configure, build, and test CMake Linux player
        run: |
          player_build="$RUNNER_TEMP/nakagawa-cmake-player"
          cmake -S . -B "$player_build" -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_PREFIX_PATH=/usr/local \
            -DBUILD_PLAYER=ON
          cmake --build "$player_build" --parallel 2
          ctest --test-dir "$player_build" --output-on-failure
          help_output=$(SDL_VIDEODRIVER=offscreen "$player_build/nakagawa_player" --help)
          printf '%s\n' "$help_output"
          grep -Fq "Usage: nakagawa_player" <<<"$help_output"

      - name: Build and run the Linux showcase headlessly
        id: showcase
        run: |
          export NK_SHOWCASE_BUILD_ROOT="$RUNNER_TEMP/showcase-build"
          export NK_SHOWCASE_DEMO_ROOT="$RUNNER_TEMP/showcase-demo"
          make CC=gcc showcase-linux

      # A failed smoke names runtime.log; keep it (and the window captures) so the
      # failure can be diagnosed from the run instead of reproduced.
      - name: Upload the Linux showcase smoke evidence on failure
        if: failure() && steps.showcase.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-smoke-linux-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/showcase-build/smoke/
            ${{ runner.temp }}/showcase-build/screenshots/
            ${{ runner.temp }}/showcase-demo/packages/*/snap_f*.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke the CMake Linux player headlessly
        run: |
          player_build="$RUNNER_TEMP/nakagawa-cmake-player"
          iso="$RUNNER_TEMP/showcase-build/showcase-scene-v1/TEST00007.iso"
          test -f "$iso"
          # Redirect every XDG root the player reads, so a stage run never writes
          # under the runner's HOME (native_test_isolation.c sets the same four).
          mkdir -p "$RUNNER_TEMP/player-smoke-data" "$RUNNER_TEMP/player-smoke-config" \
            "$RUNNER_TEMP/player-smoke-cache" "$RUNNER_TEMP/player-smoke-state"
          stage_output=$(XDG_DATA_HOME="$RUNNER_TEMP/player-smoke-data" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/player-smoke-config" \
            XDG_CACHE_HOME="$RUNNER_TEMP/player-smoke-cache" \
            XDG_STATE_HOME="$RUNNER_TEMP/player-smoke-state" \
            SDL_VIDEODRIVER=offscreen timeout 60s \
            "$player_build/nakagawa_player" "--iso=$iso" --stage-only)
          printf '%s\n' "$stage_output"
          grep -Fq "STAGING_RESULT status=PASS" <<<"$stage_output"

      - name: Stage the installed Linux player and smoke the installed binary
        run: |
          set -euo pipefail
          player_build="$RUNNER_TEMP/nakagawa-cmake-player"
          install_dir="$RUNNER_TEMP/nk-install"
          iso="$RUNNER_TEMP/showcase-build/showcase-scene-v1/TEST00007.iso"
          test -f "$iso"
          # Redirect all four XDG roots, so the .desktop entry and icon land under
          # RUNNER_TEMP and never under the runner's HOME.
          xdg_root="$RUNNER_TEMP/nk-install-xdg"
          mkdir -p "$xdg_root/data" "$xdg_root/config" "$xdg_root/cache" "$xdg_root/state"
          export XDG_DATA_HOME="$xdg_root/data" XDG_CONFIG_HOME="$xdg_root/config" \
            XDG_CACHE_HOME="$xdg_root/cache" XDG_STATE_HOME="$xdg_root/state"
          python tools/stage_install.py --dest "$install_dir" \
            --player "$player_build/nakagawa_player" --desktop-shortcut
          test -x "$install_dir/bin/nakagawa_player"
          test -f "$install_dir/source/tools/nk_cli.py"
          test -f "$XDG_DATA_HOME/applications/nakagawa-recomp.desktop"
          test -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/nakagawa-recomp.png"
          help_output=$(SDL_VIDEODRIVER=offscreen "$install_dir/bin/nakagawa_player" --help)
          printf '%s\n' "$help_output"
          grep -Fq "Usage: nakagawa_player" <<<"$help_output"
          # Run the installed binary from outside the checkout, so nothing resolves
          # against the source tree's working directory.
          smoke_cwd="$RUNNER_TEMP/nk-install-cwd"
          mkdir -p "$smoke_cwd"
          cd "$smoke_cwd"
          stage_output=$(SDL_VIDEODRIVER=offscreen timeout 60s \
            "$install_dir/bin/nakagawa_player" "--iso=$iso" --stage-only)
          printf '%s\n' "$stage_output"
          grep -Fq "STAGING_RESULT status=PASS" <<<"$stage_output"

      - name: Run selftest (C++ interpreter unit tests under UBSan)
        run: |
          g++ -std=c++17 -O1 -Isrc/ref -Isrc/rt -o build/selftest \
            src/ref/selftest.cpp src/ref/interp.cpp src/ref/run_elf.cpp \
            -DSR_SELFTEST_ONLY -fno-exceptions \
            -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all
          ./build/selftest

      - name: Run portable FPU/VFPU conversion selftest under UBSan
        # Fixed expected vectors exercise NaN, infinities, finite overflow,
        # signed boundaries, ties, all guest rounding modes and VFPU scaling.
        # float-cast-overflow remains enabled: the historical implementation
        # reached that sanitizer on FLT_MAX and must never be suppressed.
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Werror -Isrc/rt \
            -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all \
            -o build/fp_convert_selftest_san src/rt/fp_convert_selftest.c -lm
          ./build/fp_convert_selftest_san

      - name: Run VFPU table loader selftest (source-owned, no game inputs)
        # Issue #187: fail-closed table load (exact length + EOF + SHA-256 +
        # value-domain invariants), atomic once-only publication and concurrent
        # first use. Linux gcc provides C11 threads, so the concurrency race is
        # exercised here in addition to the Windows Win32-thread path.
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -D_CRT_SECURE_NO_WARNINGS \
            -o build/vfpu_tables_selftest \
            src/rt/vfpu_tables_selftest.c src/rt/vfpu_tables.c
          ./build/vfpu_tables_selftest

      - name: Run watchpoints-file parser selftest (source-owned, no game inputs)
        # Issue #188: the derived watchpoints.json artifact round-trips a
        # canonical fixture into the expected native watchpoint set, plus
        # fail-closed cases (version/format, bounds, labels,
        # duplicates, capacity, legacy array form).
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -D_CRT_SECURE_NO_WARNINGS \
            -o build/watchpoints_file_selftest \
            src/rt/watchpoints_file_selftest.c src/rt/watchpoints_file.c
          ./build/watchpoints_file_selftest

      - name: Run strbuf checked-append formatting selftest under UBSan
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
            -Isrc/rt -o build/strbuf_selftest_san src/rt/strbuf_selftest.c
          ./build/strbuf_selftest_san

      - name: Run VFPU interpreter selftest (source-owned, no game inputs)
        # Issue #184: quad/vector VFPU memory ops are all-or-nothing (span
        # preflight before any lane commit; rejected ops consume no prefixes),
        # vcrs rejects non-triple widths with zero state change, and the vrot
        # overlap scan only inspects active lanes. White-box TU includes the
        # real recomp.c/vfpu_tables.c/vfpu_interp.c (heap_selftest pattern).
        # The ASan/UBSan build below is the source-owned uninitialized-read and
        # overflow gate the issue asks for; Windows/MinGW cannot run sanitizers.
        #
        # This TU #includes recomp.c, whose dispatch() consumes the generic
        # title-configuration accessors, so it must link src/rt/title_config.c
        # against a generated artifact exactly as the Makefile target does. The
        # generic configuration is what CI wants: no manifest, every binding
        # disabled, both typed collections empty. recomp.c's sr_lookup()/
        # dispatch() also consult the exec-span registry and interpreter floor,
        # so src/rt/guest_interp.c must be linked here exactly as the Makefile
        # target does.
        run: |
          mkdir -p build/title-config/generic
          python tools/title_runtime_config.py \
            --output build/title-config/generic/sr_title_config.h
          python tools/vfpu_overlap_diff_gen.py build/vfpu_overlap_diff_cases.h
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -Ibuild/title-config/generic -Ibuild \
            -D_CRT_SECURE_NO_WARNINGS \
            -o build/vfpu_interp_selftest \
            src/rt/vfpu_interp_selftest.c src/rt/guest_interp.c src/rt/cpu_lle.c src/rt/domain_mode.c src/rt/stale_code.c src/rt/title_config.c src/rt/perf.c -lm
          ./build/vfpu_interp_selftest
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -Ibuild/title-config/generic -Ibuild \
            -D_CRT_SECURE_NO_WARNINGS \
            -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all \
            -o build/vfpu_interp_selftest_san \
            src/rt/vfpu_interp_selftest.c src/rt/guest_interp.c src/rt/cpu_lle.c src/rt/domain_mode.c src/rt/stale_code.c src/rt/title_config.c src/rt/perf.c -lm
          ./build/vfpu_interp_selftest_san

      - name: Run ATRAC3+ decoder and bridge selftests (source-owned, no game inputs)
        # #286/#32: PR-A raw decoder (4144 checks) and PR-B HLE decode bridge
        # (4138 checks) under ASan/UBSan. The suites cover the deterministic
        # terminator + MONO transform-path canaries, malformed/garbage-input
        # rejection with the nb_samples=0 failure contract, and the
        # reset/recreate lifecycle. The optional private fixture hook
        # (ATRAC3P_FIXTURE, stream.bin + meta.txt) reports SKIP when unset and
        # is never committed. Windows/MinGW cannot run sanitizers, so this
        # Linux job is the ATRAC uninitialized-read/overflow gate; the FFmpeg
        # n4.4 import stays byte-exact (no instrumentation edits). Upstream
        # import warnings are expected and intentionally not enforced.
        run: |
          set -euo pipefail
          ATRAC3P_SRCS="src/rt/atrac3p/atrac3p_api.c \
            src/rt/atrac3p/libavcodec/atrac.c src/rt/atrac3p/libavcodec/atrac3.c \
            src/rt/atrac3p/libavcodec/atrac3plus.c \
            src/rt/atrac3p/libavcodec/atrac3plusdec.c src/rt/atrac3p/libavcodec/atrac3plusdsp.c \
            src/rt/atrac3p/libavcodec/bitstream.c src/rt/atrac3p/libavcodec/fft_float.c \
            src/rt/atrac3p/libavcodec/fft_init_table.c src/rt/atrac3p/libavcodec/mdct_float.c \
            src/rt/atrac3p/libavcodec/sinewin.c src/rt/atrac3p/libavutil/float_dsp.c \
            src/rt/atrac3p/libavutil/intmath.c src/rt/atrac3p/libavutil/log2_tab.c \
            src/rt/atrac3p/libavutil/mem.c src/rt/atrac3p/libavutil/reverse.c"
          INC="-Isrc/rt -Itests/native -Isrc/rt/atrac3p -Isrc/rt/atrac3p/libavcodec -Isrc/rt/atrac3p/libavutil"
          gcc -std=c11 -O1 $INC -o build/atrac3p_selftest \
            src/rt/atrac3p_selftest.c $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_selftest
          gcc -std=c11 -O1 $INC -o build/atrac3p_bridge_selftest \
            src/rt/atrac3p_bridge_selftest.c src/rt/atrac3p_bridge.c src/rt/perf.c tests/native/pcm_wav_dump.c \
            $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_bridge_selftest
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=all"
          gcc -std=c11 -O1 $SAN $INC -o build/atrac3p_selftest_san \
            src/rt/atrac3p_selftest.c $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_selftest_san
          gcc -std=c11 -O1 $SAN $INC -o build/atrac3p_bridge_selftest_san \
            src/rt/atrac3p_bridge_selftest.c src/rt/atrac3p_bridge.c src/rt/perf.c tests/native/pcm_wav_dump.c \
            $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_bridge_selftest_san

      - name: Build run_elf (Interpreter runner)
        run: |
          g++ -std=c++17 -O1 -Isrc/ref -Isrc/rt -o build/run_elf \
            src/ref/run_elf.cpp src/ref/interp.cpp -fno-exceptions

      - name: Generate synthetic microtest C source (Gate A — generic MIPS III + FPU)
        run: python tools/gen_microtest.py build/microtest_a.c 2 --groups integer,fpu

      - name: Compile MIPS microtest ELF (Gate A, -march=r4000 -mfp32)
        # -mfp32 is required so the single-precision FPU test group may use odd
        # float registers ($f1/$f3/...), which the generic MIPS assembler
        # otherwise rejects ("float register should be even").
        run: |
          mipsel-linux-gnu-gcc -nostdlib -static -Ttext=0x08900000 \
            -march=r4000 -mabi=32 -mfp32 -Ibuild -o build/microtest_a.elf build/microtest_a.c

      - name: Generate synthetic microtest C source (Gate B — Allegrex extensions)
        run: python tools/gen_microtest.py build/microtest_b.c 2 --groups allegrex

      - name: Compile MIPS microtest ELF (Gate B, -march=r4000)
        # -march=r4000 is a conservative base MIPS ISA sufficient for function
        # prologue, lui/ori, mult/multu, mfhi/mflo, general setup, and explicit
        # syscall termination. Every Allegrex instruction-under-test is emitted
        # as a raw .word by gen_microtest.py, so no assembler ISA extension is
        # trusted for their encoding. No PSPSDK required.
        run: |
          mipsel-linux-gnu-gcc -nostdlib -static -Ttext=0x08900000 \
            -march=r4000 -mabi=32 -Ibuild -o build/microtest_b.elf build/microtest_b.c

      - name: Create dummy init trace for interpreter
        run: echo "# init r29=0x09f00000" > build/init.trace

      - name: Generate golden oracle trace (Gate A)
        run: |
          mkdir -p build/verify/gold
          SR_PPM_DUMP=build/verify/gold/frame_0001.ppm ./build/run_elf build/microtest_a.elf build/init.trace build/microtest_a.trace

      - name: Run recompiler codegen gate (Gate A — compile and verify MIPS-to-C translation)
        run: |
          mkdir -p build/verify/snap
          SR_PPM_DUMP=build/verify/snap/frame_0001.ppm CC=gcc python tools/codegen_gate.py build/microtest_a.elf build/microtest_a.trace build/verify

      - name: Generate golden oracle trace (Gate B)
        run: |
          mkdir -p build/verify/gold
          SR_PPM_DUMP=build/verify/gold/frame_0002.ppm ./build/run_elf build/microtest_b.elf build/init.trace build/microtest_b.trace

      - name: Run recompiler codegen gate (Gate B — Allegrex extensions)
        run: |
          mkdir -p build/verify/snap
          SR_PPM_DUMP=build/verify/snap/frame_0002.ppm CC=gcc python tools/codegen_gate.py build/microtest_b.elf build/microtest_b.trace build/verify

      - name: Run synthetic framebuffer-memory parity checks (A/B framebuffer diffs)
        run: |
          python tools/ppmdiff.py --threshold 3 build/verify/snap build/verify/gold
          python -c "import json; r=json.load(open('visual_regression_report.json')); exit(1 if r['summary']['failed_frames'] > 0 else 0)"

  windows_runtime:
    name: Windows runtime compile gate
    runs-on: windows-2022
    # Runs alongside the Linux gates rather than after them: it is the longest job
    # (~6.5 min), and waiting for python_tools/native_tools put ~2.5 min on every
    # PR's critical path. A Linux failure still fails ci_required; the Windows run
    # is then merely redundant, which costs nothing on a public repository.
    # Not gated on hygiene (docs/CI.md, "Hygiene beside the substantive gates").
    needs: [classify, public_export, profile_zero_fixture]
    if: >-
      ${{ always() && needs.classify.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.profile_zero_fixture.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          needs.classify.outputs.run_windows == 'true' }}
    # The gates are split into parallel matrix parts of comparable length (#694),
    # measured on hosted runners: the serial job took ~16 minutes, of which ~1.5
    # is shared setup. Every part repeats the cheap setup and the runtime-object
    # compile gate; each other step runs in exactly one part, and steps that
    # depend on one another (the staged smoke on the production smoke) share it.
    # tools/test_public_ci_wiring.py pins that every gate the serial job ran still
    # runs in exactly one part. needs.windows_runtime.result aggregates all parts.
    #   smoke:     production pipeline, AOT-gap, staged smoke, player, UI, display
    #   ladder:    full platform ladder
    #   routes:    profile-zero production routes, native core tests
    #   selftests: cosimulation + mutants, scheduler, dispatch, FP, strbuf, HLE thread
    #   fuzz-0/1:  synthetic VFPU fuzzer, its cases split between two shards (FUZZ_CASE_SHARD)
    strategy:
      fail-fast: false
      matrix:
        part: [smoke, ladder, routes, selftests, fuzz-0, fuzz-1]
    timeout-minutes: 25
    # This job's MSYS2 shell has no git on PATH, so the Makefile cannot resolve a
    # revision here; it used to log a raw `process_begin: CreateProcess(NULL, git
    # rev-parse HEAD, ...) failed` and then build every binary of this job with an
    # EMPTY identity (flight recorder build_id, #532). Forward the revision the
    # checkout actually contains -- actions/checkout resolves the triggering ref,
    # whose sha is github.sha -- so a Windows-built binary records its real
    # identity and the Makefile never has to reach for git. The Linux jobs run
    # with git on PATH and resolve the same revision themselves.
    env:
      SR_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Windows CPython 3.15.1
        id: windows-cpython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          architecture: x64

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # Keep the toolchain dependency install explicit.  Compiled objects
          # are never restored from another job or run: Make's content-addressed
          # invalidation and shader freshness checks remain authoritative. The
          # only reuse is the job-local compiler cache set up below.
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader

      # MSYS2 still ships Python 3.14.8. Repository tools and Make recipes use
      # the separately installed Windows CPython 3.15.1 through PYTHON; the
      # UCRT64 compiler and libraries remain first on PATH.
      - name: Pin the Windows Python toolchain (CPython 3.15.1)
        shell: pwsh
        env:
          PYTHON_EXE: ${{ steps.windows-cpython.outputs.python-path }}
        run: |
          $version = & $env:PYTHON_EXE -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          if ($LASTEXITCODE -ne 0 -or $version -ne "3.15.1") {
            throw "Expected Windows CPython 3.15.1, got '$version'"
          }
          $pythonPath = $env:PYTHON_EXE.Replace('\', '/')
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PYTHON=$pythonPath`n", $utf8NoBom)

      - name: Verify default and override compiler resolution
        shell: msys2 {0}
        run: |
          set -euo pipefail
          unset CC

          default_info="$(
            mingw32-make --no-print-directory \
              GAME_NAME=ci BUILD_DIR=build/compiler-probe VULKAN_SDK=/ucrt64 \
              compiler-info
          )"
          printf '%s\n' "$default_info"
          grep -Fx 'CC=gcc' <<<"$default_info"
          grep -Fx 'CC_ORIGIN=file' <<<"$default_info"
          command -v gcc
          gcc --version

          override_info="$(
            mingw32-make --no-print-directory \
              GAME_NAME=ci BUILD_DIR=build/compiler-probe VULKAN_SDK=/ucrt64 \
              CC=clang compiler-info
          )"
          printf '%s\n' "$override_info"
          grep -Fx 'CC=clang' <<<"$override_info"
          grep -Fx 'CC_ORIGIN=command line' <<<"$override_info"

      # Each part compiles the same runtime sources into several build trees: the
      # platform ladder once per rung, the smoke part once per smoke. A compiler
      # cache local to this job serves those repeats (#735 item 2, owner decision
      # 2026-10-27). ccache keys an entry on every input -- the compiler, the
      # command line and the full contents of every header -- so it returns an
      # object only for an identical compile, and Make still decides what to
      # build. The cache starts empty under RUNNER_TEMP and is never restored,
      # uploaded or shared with another job or run.
      #
      # `gcc` becomes a native symlink to the UCRT64 toolchain's own ccache.exe
      # (ccache's masquerade mode), which then runs /ucrt64/bin/gcc. A profile
      # script puts it ahead of /ucrt64/bin for every later MSYS2 step, so CC stays
      # `gcc`, and SDL3 discovery and the toolchain check in
      # tools/nk_doctor_checks.py, which follow the link into /ucrt64/bin, still
      # find this toolchain. The compiler resolution check above runs before this,
      # against the plain toolchain.
      - name: Route this job's compiles through a job-local compiler cache
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cache="$(cygpath -u "$RUNNER_TEMP")/ccache"
          mkdir -p "$cache/bin" "$cache/objects"
          # nativestrict fails instead of silently copying the executable.
          MSYS=winsymlinks:nativestrict ln -s /ucrt64/bin/ccache.exe "$cache/bin/gcc.exe"
          {
            printf "export CCACHE_DIR='%s'\n" "$(cygpath -m "$cache/objects")"
            printf "export PATH='%s':\"\$PATH\"\n" "$cache/bin"
          } > /etc/profile.d/zz-job-compiler-cache.sh
          # shellcheck disable=SC1091
          . /etc/profile.d/zz-job-compiler-cache.sh
          test "$(command -v gcc)" = "$cache/bin/gcc"
          test "$(readlink -f "$cache/bin/gcc.exe")" = /ucrt64/bin/ccache.exe
          gcc --version
          ccache --version
          ccache --zero-stats

      # -j2 uses both vCPUs of the hosted runner for these independent object
      # compiles (#694); the gate is the same target and the same objects.
      - name: Compile Windows runtime objects through the default compiler path
        shell: msys2 {0}
        run: |
          unset CC
          mingw32-make -j2 GAME_NAME=ci BUILD_DIR=build/windows-runtime \
            VULKAN_SDK=/ucrt64 runtime-objects

      # This is the executable production-path gate. It generates a public
      # PSP-shaped PRX, runs the normal loader/import/analyzer/codegen pipeline,
      # links every production runtime object with the real driver, and reaches
      # a real HLE NID through the scheduler before checking the guest sentinel.
      - name: Build and run full production pipeline smoke
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        # The ordinary compile target invokes the repository's PowerShell 7.4
        # asset-copy script after linking. Keep the broader Windows PATH scoped
        # to this step so MSYS2 can resolve the runner's `pwsh` without changing
        # tool selection in the other UCRT64 compile gates.
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke

      # AOT-gap seam proof on the same source-owned fixture: the helper is
      # omitted from native emission at build time, so region A reaches it via
      # the ordinary production dispatch() path. Generated executable-span
      # ownership gates interpretation, and the run must hand off to registered
      # AOT region B before the final production-driver assertion can pass.
      - name: Build and run AOT-gap dispatch-seam smoke
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke-gap

      - name: Run native core test suite on Windows
        if: matrix.part == 'routes'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mingw32-make --no-print-directory CC=gcc native-core-tests

      # Hosted build/link gate for the public player/launcher (#294). Link-only
      # proof: the player's GUI smoke remains a developer/display gate.
      - name: Build and link the native player
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player-ui-tests

      - name: Run native player UI regressions headlessly on Windows
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player-ui-regressions

      # Windows counterpart of the Linux staging smoke (#308): the built player must
      # stage a TEST00007 disc headlessly and report STAGING_RESULT status=PASS, so a
      # Windows-only staging regression fails hosted CI. This runner has no PSPDEV, so
      # the disc wraps the source-owned display guest under the showcase's synthetic
      # identity (fixtures/showcase/showcase.py stage-iso). Staging reads the disc
      # identity, the manifest and the executable's bytes, not the guest's code. Every
      # user-data root is redirected under the runner temp directory, never a profile.
      - name: Smoke the Windows player staging headlessly
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          smoke="$(cygpath -m "$RUNNER_TEMP")/windows-stage-smoke"
          mkdir -p "$smoke/disc" "$smoke/localappdata" "$smoke/appdata" "$smoke/userprofile"
          py="$(cygpath -u "$PYTHON")"
          "$py" fixtures/showcase/showcase.py stage-iso --out-dir "$smoke/disc"
          stage_output=$(LOCALAPPDATA="$smoke/localappdata" APPDATA="$smoke/appdata" \
            USERPROFILE="$smoke/userprofile" SDL_VIDEODRIVER=offscreen timeout 60s \
            build/nakagawa_player.exe "--iso=$smoke/disc/TEST00007.iso" --stage-only)
          printf '%s\n' "$stage_output"
          grep -Fq "STAGING_RESULT status=PASS" <<<"$stage_output"

      # Run the same smoke with the executable staged outside its build tree
      # (#294): a launcher/staging path bug must fail in CI, not only in the
      # build-tree spelling. Depends on the production-smoke step above; the
      # rebuild underneath is incremental, so this re-runs only generate/verify/run.
      - name: Stage and run production smoke outside its build directory
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke-staged

      # The complete source-owned ladder matrix (#294), superset of the former
      # ladder-fs-only step: zero/reloc/gap/sched/fpu/fs/fs-negative/title2/
      # title2-negative.
      - name: Build and run the full platform ladder
        if: matrix.part == 'ladder'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 platform-ladder

      - name: Fetch the profile-zero fixture built from source
        if: matrix.part == 'routes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-zero-fixture
          path: fixtures/profile_zero/prebuilt

      # The two #309 manifests use this manifest-driven guest -> ProgramImage ->
      # AOT package -> production runtime route (#557). The Windows runner has no
      # PSPDEV/PSPSDK, so the route runs on the fixture the profile_zero_fixture job
      # built from source and verified against the pinned digests; on hosts with
      # PSPDEV the test rebuilds it itself. Its only remaining SKIP is a missing
      # host multimedia dependency (Vulkan SDK / SDL3), printed with the reason.
      - name: Build and run profile-zero production routes
        if: matrix.part == 'routes'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 profile-zero-e2e

      # Presentation path on a source-owned guest: fill the PSP framebuffer, hand
      # it to sceDisplaySetFrameBuf and wait for vblank, once per frame. The other
      # smokes prove compute and the dispatch seam but never reach the display
      # source, so a scheduler change that stops delivering vblanks to a guest
      # whose only wait is a vblank wait was invisible to every hosted gate. Runs
      # headless (--sched), then through the normal --sched --gui route with
      # SR_VIDEO=offscreen: the assertions are the guest-visible framebuffer
      # word and accepted offscreen-present ordering, so no display is required.
      - name: Build and run display presentation smoke
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 display-smoke-run

      # AOT <-> interpreter differential over the same source-owned guest bytes.
      # One pipeline run produces both execution lanes; the comparator diffs the
      # canonical instruction trace, the ordered guest writes, the memory window
      # and the architectural state vector, and reports the FIRST difference.
      # Without this in CI, the only thing standing between a codegen semantic
      # regression and a title run is a developer remembering to run it.
      - name: Build and run AOT/interpreter cosimulation gate
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 cosim-selftest

      # A comparator that cannot fail proves nothing. Each mutant is a semantic
      # defect applied to a COPY of the interpreter under the ignored build tree;
      # the gate must fail for every one, and a mutant that only breaks the build
      # is rejected as INVALID rather than counted as a kill.
      - name: Prove the cosimulation comparator is load-bearing
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 cosim-mutants

      - name: Build and run scheduler selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 sched-selftest

      # The executable proof that a title binding acts only where its own
      # configuration names it. Same three-configuration shape as
      # sched-selftest -- generic, fixture-a, fixture-b -- but over dispatch()
      # rather than the scheduler. Without it in CI, the isolation claim rests
      # on a gate that only ever ran on a developer's machine.
      - name: Build and run dispatch isolation selftest matrix
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 dispatch-isolation-selftest

      - name: Build and run portable FPU/VFPU conversion selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 fp-convert-selftest

      - name: Build and run strbuf checked-append formatting selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 strbuf-selftest

      # hle-thread-selftest compiles src/rt/hle.c directly, so it is the only
      # gate that catches a target drifting out of step with hle.c's own
      # dependencies. It was absent here, and silently stopped building when
      # #315 added the ATRAC3+ bridge; that failure then hid #326 breaking the
      # same target again. Building it in CI is what stops the third recurrence.
      - name: Build and run HLE thread selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 hle-thread-selftest

      # The flash0: font device contract (hle_thread_selftest --flash0-font over synthetic
      # PGFs) is driven by tools/test_flash0_font.py, which skips wherever mingw32-make is
      # absent; before this step no hosted job ran it at all.
      - name: Build and run flash0 font device selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: |
          py="$(cygpath -u "$PYTHON")"
          PYTHONPATH=tools "$py" -m unittest -v test_flash0_font

      # The synthetic VFPU fuzzer's cases run as two shards: shard k admits the cases with
      # index % 2 == k (src/rt/vfpu_fuzz.c). Together they admit every case exactly once,
      # which the "Prove the fuzz shards" step checks from the binary. A shard fails unless
      # every case it admits is tested, so no case is dropped from the gate.
      - name: Build and run synthetic VFPU fuzzer (shard 0 of 2)
        if: matrix.part == 'fuzz-0'
        shell: msys2 {0}
        env:
          FUZZ_CASE_SHARD: "0/2"
        run: |
          py="$(cygpath -u "$PYTHON")"
          "$py" tools/vfpu_fuzz_gen.py --synthetic build/windows-runtime/vfpu_fuzz_cases.h
          printf 'void f_00304290(void *s) { (void)s; }\n' > build/windows-runtime/ci_recomp.c
          touch build/windows-runtime/ci_recomp_funcs.h
          touch build/windows-runtime/.recomp-trace-0
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime \
            VFPU_FUZZ_PREGENERATED=1 CC=gcc VULKAN_SDK=/ucrt64 -j4 vfpu_fuzz_build

      - name: Build and run synthetic VFPU fuzzer (shard 1 of 2)
        if: matrix.part == 'fuzz-1'
        shell: msys2 {0}
        env:
          FUZZ_CASE_SHARD: "1/2"
        run: |
          py="$(cygpath -u "$PYTHON")"
          "$py" tools/vfpu_fuzz_gen.py --synthetic build/windows-runtime/vfpu_fuzz_cases.h
          printf 'void f_00304290(void *s) { (void)s; }\n' > build/windows-runtime/ci_recomp.c
          touch build/windows-runtime/ci_recomp_funcs.h
          touch build/windows-runtime/.recomp-trace-0
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime \
            VFPU_FUZZ_PREGENERATED=1 CC=gcc VULKAN_SDK=/ucrt64 -j4 vfpu_fuzz_build

      # The shard proof runs the same binary once more with FUZZ_TRIALS=1 (case selection does
      # not depend on the trial count): the default run, then 0/2 and 1/2. It requires the
      # shards to be disjoint and to union to the default's full case list.
      - name: Prove the fuzz shards cover every case exactly once
        if: matrix.part == 'fuzz-0'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          py="$(cygpath -u "$PYTHON")"
          PYTHONPATH=tools NK_VFPU_FUZZ_BIN=build/windows-runtime/vfpu_fuzz.exe "$py" -m unittest -v test_public_ci_wiring.VfpuFuzzShardTests

      # What the job-local compiler cache served in this part. Every part compiles
      # the runtime objects through it, so a part that recorded no compile at all
      # bypassed the cache, and that fails here rather than passing unnoticed.
      - name: Report the job-local compiler cache statistics
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ccache --show-stats --verbose
          compiles="$(ccache --print-stats | awk '$1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" || $1 == "cache_miss" { n += $2 } END { print n + 0 }')"
          echo "compiles through the job-local cache: $compiles"
          test "$compiles" -gt 0

  main_smoke:
    name: Main integration smoke
    runs-on: ubuntu-26.04
    needs: [classify, hygiene, public_export]
    if: >-
      ${{ always() && needs.classify.result == 'success' && needs.hygiene.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.classify.outputs.run_main_smoke == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Run compact import/publication smoke
        # Publication audit is part of the always-present hygiene job; this
        # smoke adds a fresh main-branch import gate without repeating it.
        run: python tools/import_audit_gate.py

      - name: Run provenance record and disposition gap check
        # #355: ratchets disposition gaps for upstream-derived production paths.
        run: python tools/provenance_record_gap.py --check

  ci_required:
    name: CI required
    runs-on: ubuntu-26.04
    needs: [classify, hygiene, public_export, markdown, python_tools, native_tools, windows_runtime, main_smoke]
    if: ${{ always() }}
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      HYGIENE_RESULT: ${{ needs.hygiene.result }}
      PUBLIC_EXPORT_RESULT: ${{ needs.public_export.result }}
      MARKDOWN_RESULT: ${{ needs.markdown.result }}
      PYTHON_RESULT: ${{ needs.python_tools.result }}
      NATIVE_RESULT: ${{ needs.native_tools.result }}
      WINDOWS_RESULT: ${{ needs.windows_runtime.result }}
      MAIN_SMOKE_RESULT: ${{ needs.main_smoke.result }}
      RUN_MARKDOWN: ${{ needs.classify.outputs.run_markdown }}
      RUN_PYTHON: ${{ needs.classify.outputs.run_python }}
      RUN_NATIVE: ${{ needs.classify.outputs.run_native }}
      RUN_WINDOWS: ${{ needs.classify.outputs.run_windows }}
      RUN_MAIN_SMOKE: ${{ needs.classify.outputs.run_main_smoke }}
      ALLOW_SUBSTANTIVE: ${{ needs.classify.outputs.allow_substantive }}
      DRAFT: ${{ needs.classify.outputs.draft }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check applicable gate results
        run: python tools/ci_required.py
