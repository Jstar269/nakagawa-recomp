name: CI

on:
  # Pull-request events that can carry a new head: opened (the first head),
  # synchronize (new commits), reopened. Draft status does not suppress
  # substantive gates (tools/ci_paths.py exports allow_substantive
  # independently of draft), so a draft head is already fully validated and
  # needs no transition to become so.
  #
  # The status transitions are deliberately NOT listed. ready_for_review and
  # converted_to_draft never change the head, so they could only re-run the
  # matrix over a tree that was already validated - and, because concurrency
  # cancels in progress, a draft -> ready transition used to cancel the very
  # run it then duplicated. A new head is still covered by synchronize.
  pull_request:
    types: [opened, synchronize, reopened]
  # Feature-branch commits are covered by pull_request.  A normal main push
  # keeps only the compact smoke gate; workflow changes are the exception and
  # request the full validation needed to prove the new CI itself.
  push:
    branches: [main]
  # A manual run always executes the complete matrix, including main_smoke:
  # tools/ci_paths.py forces full validation for workflow_dispatch regardless of
  # changed paths, and ci_required treats every emitted gate as required. There
  # is deliberately no input to narrow it -- a knob that cannot actually reduce
  # the run would be misleading.
  workflow_dispatch:

concurrency:
  # A new commit supersedes an in-flight run for the same PR/ref.  This is also
  # intentionally shared by draft and ready events so stale work cannot consume
  # a runner after the PR advances.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      python_tools: ${{ steps.paths.outputs.python_tools }}
      native_runtime: ${{ steps.paths.outputs.native_runtime }}
      build_system: ${{ steps.paths.outputs.build_system }}
      manager_powershell: ${{ steps.paths.outputs.manager_powershell }}
      title_manifest: ${{ steps.paths.outputs.title_manifest }}
      workflow_ci: ${{ steps.paths.outputs.workflow_ci }}
      dependency_metadata: ${{ steps.paths.outputs.dependency_metadata }}
      security_publication: ${{ steps.paths.outputs.security_publication }}
      run_markdown: ${{ steps.paths.outputs.run_markdown }}
      run_python: ${{ steps.paths.outputs.run_python }}
      python_scope: ${{ steps.paths.outputs.python_scope }}
      python_num_shards: ${{ steps.paths.outputs.python_num_shards }}
      python_shards: ${{ steps.paths.outputs.python_shards }}
      run_native: ${{ steps.paths.outputs.run_native }}
      run_windows: ${{ steps.paths.outputs.run_windows }}
      run_main_smoke: ${{ steps.paths.outputs.run_main_smoke }}
      allow_substantive: ${{ steps.paths.outputs.allow_substantive }}
      draft: ${{ steps.paths.outputs.draft }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python tools/ci_paths.py --github-output "$GITHUB_OUTPUT"

  hygiene:
    name: Hygiene and security
    runs-on: ubuntu-24.04
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Betterleaks' git mode is the history gate; a shallow checkout would
          # silently reduce it to a current-commit scan.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.2

      - name: Run shared all-files checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Enforce tracked-tree reference ratchet
        run: python tools/tree_lint.py --check

      - name: Locate the pinned Betterleaks binary
        shell: bash
        run: |
          set -euo pipefail
          # pre-commit uses the system Go toolchain when the runner provides one
          # and otherwise creates a versioned golangenv-* environment.  Discover
          # either form instead of assuming the fallback environment name.
          betterleaks_bin="$(find "${PRE_COMMIT_HOME:-$HOME/.cache/pre-commit}" -type f -path '*/golangenv-*/bin/betterleaks' -print -quit)"
          test -n "$betterleaks_bin"
          echo "BETTERLEAKS_BIN=$betterleaks_bin" >> "$GITHUB_ENV"

      - name: Scan reachable sanitized Git history with Betterleaks
        shell: bash
        run: |
          set -euo pipefail
          "$BETTERLEAKS_BIN" git . --redact --verbose

      - name: Run Betterleaks synthetic canaries
        shell: bash
        run: python tools/betterleaks_canary.py --betterleaks "$BETTERLEAKS_BIN"

  markdown:
    name: Markdown validation
    runs-on: ubuntu-24.04
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.run_markdown == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Lint repository Markdown
        run: npx --yes markdownlint-cli2@0.23.3

  # Public-export candidate audit (#293/#294), in its own job so it overlaps the all-files
  # hygiene checks instead of running after them (#735 item 5). It is a separate required
  # result: ci_required fails unless it succeeds, and every gate that waited for hygiene
  # also waits for it. The job runs on every event and gates no path, because publication
  # integrity must never be path-dependent (tools/test_ci_paths.py).
  public_export:
    name: Public export candidate audit
    runs-on: ubuntu-24.04
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # #293/#294: represent the release-export candidate path in hosted CI.
      # One invocation runs the publication gates, generates the public-safe
      # candidate, and runs the exhaustive candidate-tree audit against the
      # staging bytes. The audit requires the release-controlled trusted ledger
      # (human-only input), so without it the export MUST fail closed with
      # PROVENANCE_UNVERIFIED and never promote a candidate (#293 immutability).
      # This step asserts exactly that named boundary.
      - name: Exercise public-export generation and candidate audit
        if: >-
          ${{ needs.classify.outputs.security_publication == 'true' ||
              github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          export_dir="${RUNNER_TEMP:?}/public-export-candidate"
          set +e
          output="$(python tools/build_public_export.py --export-dir "$export_dir" --public-safe-profile 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "export cleared without the trusted ledger; the candidate audit must fail closed" >&2
            exit 1
          fi
          if ! grep -q "PROVENANCE_UNVERIFIED" <<<"$output"; then
            echo "export failed for a reason other than the named fail-closed candidate audit" >&2
            exit 1
          fi
          if [ -e "$export_dir" ]; then
            echo "an uncleared candidate must never occupy the requested export path (#293)" >&2
            exit 1
          fi

  python_tools:
    name: Python tooling gates
    runs-on: ubuntu-24.04
    needs: [classify, hygiene, public_export]
    # The suite is ~10 minutes serially. Four runners split the test files with
    # tools/ci_test_shards.py: a deterministic longest-first bin packing over the
    # measured per-module durations in tools/ci_test_weights.json (#693). Every
    # file runs exactly once across the shards, shards never share a working
    # tree, and modules that mutate tracked state never share a shard.
    # needs.python_tools.result is the aggregate of all shards, so ci_required is
    # unchanged. The shard list comes from the classifier: four shards over every
    # module, or -- when a recipe-only Makefile edit is the only reason to run
    # Python (#702) -- two shards over the modules that can observe that edit.
    strategy:
      fail-fast: false
      matrix:
        # The fallback only keeps the expression parseable when classify produced no
        # outputs; the job's own condition skips it in that case.
        shard: ${{ fromJSON(needs.classify.outputs.python_shards || '[0, 1, 2, 3]') }}
    if: >-
      ${{ always() && needs.classify.result == 'success' && needs.hygiene.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          needs.classify.outputs.run_python == 'true' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/requirements-lock.txt

      - name: Install Python tooling dependencies
        # The hashed lock installs the complete tool closure (Ruff included for
        # SBOM completeness); this job does not invoke Ruff. The hygiene job's
        # pre-commit hook is the only Ruff runner, and the pin test keeps both
        # versions equal.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps .

      - name: >-
          Run Python unit tests (shard ${{ matrix.shard }} of
          ${{ needs.classify.outputs.python_num_shards }}, ${{ needs.classify.outputs.python_scope }})
        # Same files and sys.path as `python -m unittest discover -s tools -p "test_*.py"`.
        env:
          SHARD: ${{ matrix.shard }}
          NUM_SHARDS: ${{ needs.classify.outputs.python_num_shards }}
          PYTHON_SCOPE: ${{ needs.classify.outputs.python_scope }}
        # The list is captured before use so a failing planner stops the step: a
        # process substitution would hide its exit status, and unittest given no
        # module names falls back to discovery from the repository root.
        run: |
          set -euo pipefail
          listing="$(python tools/ci_test_shards.py --shard "$SHARD" --num-shards "$NUM_SHARDS" --select "$PYTHON_SCOPE")"
          mapfile -t mods <<<"$listing"
          if [ "${#mods[@]}" -eq 0 ] || [ -z "${mods[0]}" ]; then
            echo "shard $SHARD received no test modules" >&2
            exit 1
          fi
          echo "shard $SHARD: ${#mods[@]} test files"
          PYTHONPATH=tools python -m unittest -v "${mods[@]}"

  native_tools:
    name: Native and translation gates
    runs-on: ubuntu-24.04
    needs: [classify, hygiene, public_export]
    if: >-
      ${{ always() && needs.classify.result == 'success' && needs.hygiene.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          needs.classify.outputs.run_native == 'true' }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl gcc-mipsel-linux-gnu \
            git libvulkan-dev ninja-build pkg-config

      - name: Build pinned SDL3 for headless Linux runtime
        # Build the pinned SDL release directly so CI uses the documented version.
        run: |
          SDL3_VERSION=3.4.16
          SDL3_COMMIT=fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
          git init "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$RUNNER_TEMP/SDL" fetch --depth 1 origin "$SDL3_COMMIT"
          git -C "$RUNNER_TEMP/SDL" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_INSTALL_TESTS=OFF -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_VULKAN=ON
          cmake --build "$RUNNER_TEMP/SDL/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SDL/build"
          sudo ldconfig
          # A mistyped but valid commit must fail here, not leave the docs claiming the pin.
          test "$(pkg-config --modversion sdl3)" = "$SDL3_VERSION"

      - name: Install PSPDEV from the checked-in lock
        run: |
          read -r PSPDEV_URL PSPDEV_SHA256 < <(python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("assets/upstream/pspdev.lock.json").read_text())
          evidence = json.loads(Path("assets/upstream/pspdev.evidence.json").read_text())
          distribution = lock["distribution"]
          archive = evidence["archive"]
          if distribution["release"] != evidence["release"]:
              raise SystemExit("PSPDEV release disagrees with its evidence")
          expected = distribution["archive_sha256"]
          if archive["local_sha256"] != expected or archive["github_asset_digest"] != "sha256:" + expected:
              raise SystemExit("PSPDEV archive digest disagrees with the checked-in lock")
          print(archive["download_url"], expected)
          PY
          )
          echo "PSPDEV_URL=$PSPDEV_URL" >> "$GITHUB_ENV"
          echo "PSPDEV_SHA256=$PSPDEV_SHA256" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/pspdev.tar.gz"
          curl --fail --location --retry 3 "$PSPDEV_URL" --output "$archive"
          printf '%s  %s\n' "$PSPDEV_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pspdev-unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pspdev-unpacked"
          psp_gcc=$(find "$RUNNER_TEMP/pspdev-unpacked" -path '*/bin/psp-gcc' -print -quit)
          if [[ -z "$psp_gcc" ]]; then
            echo "locked PSPDEV archive did not contain bin/psp-gcc" >&2
            exit 1
          fi
          psp_root=${psp_gcc%/bin/psp-gcc}
          test -x "$psp_root/bin/psp-prxgen"
          sudo mkdir -p /usr/local/pspdev
          sudo cp -a "$psp_root"/. /usr/local/pspdev/
          test -x /usr/local/pspdev/bin/psp-gcc
          test -x /usr/local/pspdev/bin/psp-prxgen
          echo "/usr/local/pspdev/bin" >> "$GITHUB_PATH"
          echo "PSPDEV=/usr/local/pspdev" >> "$GITHUB_ENV"

      - name: Run import-coverage and fake-success audit gate
        # Public gate for issue #71: manifest extraction from src/rt/hle.c,
        # alias/waiver balance, classification-baseline drift, and synthetic
        # malformed-ELF fixtures. Requires no game inputs.
        run: python tools/import_audit_gate.py

      - name: Run provenance record and disposition gap check
        # #355: ratchets disposition gaps for upstream-derived production paths.
        run: python tools/provenance_record_gap.py --check

      - name: Compile host-neutral runtime objects on Linux
        run: make GAME_NAME=ci BUILD_DIR=build/portable-check CC=gcc portable-core-objects

      - name: Create build directory
        run: mkdir -p build

      - name: Run native core test suite (hostile parsers, catalog, launch resolution, POSIX process)
        run: make CC=gcc native-core-tests

      - name: Run host present pacing selftest (links SDL3)
        run: make CC=gcc gui-present-selftest

      # tests/native/test_player_ui.py forces SDL's dummy video and software
      # render drivers for every player it spawns, so no step env is needed.
      - name: Run native player UI regressions headlessly
        run: make CC=gcc player-ui-regressions

      - name: Configure, build, and test CMake Linux player
        run: |
          player_build="$RUNNER_TEMP/nakagawa-cmake-player"
          cmake -S . -B "$player_build" -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_PREFIX_PATH=/usr/local \
            -DBUILD_PLAYER=ON
          cmake --build "$player_build" --parallel 2
          ctest --test-dir "$player_build" --output-on-failure
          help_output=$(SDL_VIDEODRIVER=offscreen "$player_build/nakagawa_player" --help)
          printf '%s\n' "$help_output"
          grep -Fq "Usage: nakagawa_player" <<<"$help_output"

      - name: Build and run the Linux showcase headlessly
        id: showcase
        run: |
          export NK_SHOWCASE_BUILD_ROOT="$RUNNER_TEMP/showcase-build"
          export NK_SHOWCASE_DEMO_ROOT="$RUNNER_TEMP/showcase-demo"
          make CC=gcc showcase-linux

      # A failed smoke names runtime.log; keep it (and the window captures) so the
      # failure can be diagnosed from the run instead of reproduced.
      - name: Upload the Linux showcase smoke evidence on failure
        if: failure() && steps.showcase.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-smoke-linux-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/showcase-build/smoke/
            ${{ runner.temp }}/showcase-build/screenshots/
            ${{ runner.temp }}/showcase-demo/packages/*/snap_f*.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke the CMake Linux player headlessly
        run: |
          player_build="$RUNNER_TEMP/nakagawa-cmake-player"
          iso="$RUNNER_TEMP/showcase-build/showcase-scene-v1/TEST00007.iso"
          test -f "$iso"
          mkdir -p "$RUNNER_TEMP/player-smoke-data"
          stage_output=$(XDG_DATA_HOME="$RUNNER_TEMP/player-smoke-data" \
            SDL_VIDEODRIVER=offscreen timeout 60s \
            "$player_build/nakagawa_player" "--iso=$iso" --stage-only)
          printf '%s\n' "$stage_output"
          grep -Fq "STAGING_RESULT status=PASS" <<<"$stage_output"

      - name: Run selftest (C++ interpreter unit tests under UBSan)
        run: |
          g++ -std=c++17 -O1 -Isrc/ref -Isrc/rt -o build/selftest \
            src/ref/selftest.cpp src/ref/interp.cpp src/ref/run_elf.cpp \
            -DSR_SELFTEST_ONLY -fno-exceptions \
            -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all
          ./build/selftest

      - name: Run portable FPU/VFPU conversion selftest under UBSan
        # Fixed expected vectors exercise NaN, infinities, finite overflow,
        # signed boundaries, ties, all guest rounding modes and VFPU scaling.
        # float-cast-overflow remains enabled: the historical implementation
        # reached that sanitizer on FLT_MAX and must never be suppressed.
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Werror -Isrc/rt \
            -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all \
            -o build/fp_convert_selftest_san src/rt/fp_convert_selftest.c -lm
          ./build/fp_convert_selftest_san

      - name: Run VFPU table loader selftest (source-owned, no game inputs)
        # Issue #187: fail-closed table load (exact length + EOF + SHA-256 +
        # value-domain invariants), atomic once-only publication and concurrent
        # first use. Linux gcc provides C11 threads, so the concurrency race is
        # exercised here in addition to the Windows Win32-thread path.
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -D_CRT_SECURE_NO_WARNINGS \
            -o build/vfpu_tables_selftest \
            src/rt/vfpu_tables_selftest.c src/rt/vfpu_tables.c
          ./build/vfpu_tables_selftest

      - name: Run watchpoints-file parser selftest (source-owned, no game inputs)
        # Issue #188: the derived watchpoints.json artifact round-trips a
        # canonical fixture into the expected native watchpoint set, plus
        # fail-closed cases (version/format, bounds, labels,
        # duplicates, capacity, legacy array form).
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -D_CRT_SECURE_NO_WARNINGS \
            -o build/watchpoints_file_selftest \
            src/rt/watchpoints_file_selftest.c src/rt/watchpoints_file.c
          ./build/watchpoints_file_selftest

      - name: Run strbuf checked-append formatting selftest under UBSan
        run: |
          gcc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
            -Isrc/rt -o build/strbuf_selftest_san src/rt/strbuf_selftest.c
          ./build/strbuf_selftest_san

      - name: Run VFPU interpreter selftest (source-owned, no game inputs)
        # Issue #184: quad/vector VFPU memory ops are all-or-nothing (span
        # preflight before any lane commit; rejected ops consume no prefixes),
        # vcrs rejects non-triple widths with zero state change, and the vrot
        # overlap scan only inspects active lanes. White-box TU includes the
        # real recomp.c/vfpu_tables.c/vfpu_interp.c (heap_selftest pattern).
        # The ASan/UBSan build below is the source-owned uninitialized-read and
        # overflow gate the issue asks for; Windows/MinGW cannot run sanitizers.
        #
        # This TU #includes recomp.c, whose dispatch() consumes the generic
        # title-configuration accessors, so it must link src/rt/title_config.c
        # against a generated artifact exactly as the Makefile target does. The
        # generic configuration is what CI wants: no manifest, every binding
        # disabled, both typed collections empty. recomp.c's sr_lookup()/
        # dispatch() also consult the exec-span registry and interpreter floor,
        # so src/rt/guest_interp.c must be linked here exactly as the Makefile
        # target does.
        run: |
          mkdir -p build/title-config/generic
          python tools/title_runtime_config.py \
            --output build/title-config/generic/sr_title_config.h
          python tools/vfpu_overlap_diff_gen.py build/vfpu_overlap_diff_cases.h
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -Ibuild/title-config/generic -Ibuild \
            -D_CRT_SECURE_NO_WARNINGS \
            -o build/vfpu_interp_selftest \
            src/rt/vfpu_interp_selftest.c src/rt/guest_interp.c src/rt/cpu_lle.c src/rt/domain_mode.c src/rt/stale_code.c src/rt/title_config.c src/rt/perf.c -lm
          ./build/vfpu_interp_selftest
          gcc -std=c11 -O1 -Wall -Wextra -Isrc/rt -Ibuild/title-config/generic -Ibuild \
            -D_CRT_SECURE_NO_WARNINGS \
            -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all \
            -o build/vfpu_interp_selftest_san \
            src/rt/vfpu_interp_selftest.c src/rt/guest_interp.c src/rt/cpu_lle.c src/rt/domain_mode.c src/rt/stale_code.c src/rt/title_config.c src/rt/perf.c -lm
          ./build/vfpu_interp_selftest_san

      - name: Run ATRAC3+ decoder and bridge selftests (source-owned, no game inputs)
        # #286/#32: PR-A raw decoder (4144 checks) and PR-B HLE decode bridge
        # (4138 checks) under ASan/UBSan. The suites cover the deterministic
        # terminator + MONO transform-path canaries, malformed/garbage-input
        # rejection with the nb_samples=0 failure contract, and the
        # reset/recreate lifecycle. The optional private fixture hook
        # (ATRAC3P_FIXTURE, stream.bin + meta.txt) reports SKIP when unset and
        # is never committed. Windows/MinGW cannot run sanitizers, so this
        # Linux job is the ATRAC uninitialized-read/overflow gate; the FFmpeg
        # n4.4 import stays byte-exact (no instrumentation edits). Upstream
        # import warnings are expected and intentionally not enforced.
        run: |
          set -euo pipefail
          ATRAC3P_SRCS="src/rt/atrac3p/atrac3p_api.c \
            src/rt/atrac3p/libavcodec/atrac.c src/rt/atrac3p/libavcodec/atrac3plus.c \
            src/rt/atrac3p/libavcodec/atrac3plusdec.c src/rt/atrac3p/libavcodec/atrac3plusdsp.c \
            src/rt/atrac3p/libavcodec/bitstream.c src/rt/atrac3p/libavcodec/fft_float.c \
            src/rt/atrac3p/libavcodec/fft_init_table.c src/rt/atrac3p/libavcodec/mdct_float.c \
            src/rt/atrac3p/libavcodec/sinewin.c src/rt/atrac3p/libavutil/float_dsp.c \
            src/rt/atrac3p/libavutil/intmath.c src/rt/atrac3p/libavutil/log2_tab.c \
            src/rt/atrac3p/libavutil/mem.c src/rt/atrac3p/libavutil/reverse.c"
          INC="-Isrc/rt -Isrc/rt/atrac3p -Isrc/rt/atrac3p/libavcodec -Isrc/rt/atrac3p/libavutil"
          gcc -std=c11 -O1 $INC -o build/atrac3p_selftest \
            src/rt/atrac3p_selftest.c $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_selftest
          gcc -std=c11 -O1 $INC -o build/atrac3p_bridge_selftest \
            src/rt/atrac3p_bridge_selftest.c src/rt/atrac3p_bridge.c src/rt/perf.c \
            $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_bridge_selftest
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=all"
          gcc -std=c11 -O1 $SAN $INC -o build/atrac3p_selftest_san \
            src/rt/atrac3p_selftest.c $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_selftest_san
          gcc -std=c11 -O1 $SAN $INC -o build/atrac3p_bridge_selftest_san \
            src/rt/atrac3p_bridge_selftest.c src/rt/atrac3p_bridge.c src/rt/perf.c \
            $ATRAC3P_SRCS src/rt/vfpu_tables.c -lm
          ./build/atrac3p_bridge_selftest_san

      - name: Build run_elf (Interpreter runner)
        run: |
          g++ -std=c++17 -O1 -Isrc/ref -Isrc/rt -o build/run_elf \
            src/ref/run_elf.cpp src/ref/interp.cpp -fno-exceptions

      - name: Generate synthetic microtest C source (Gate A — generic MIPS III + FPU)
        run: python tools/gen_microtest.py build/microtest_a.c 2 --groups integer,fpu

      - name: Compile MIPS microtest ELF (Gate A, -march=r4000 -mfp32)
        # -mfp32 is required so the single-precision FPU test group may use odd
        # float registers ($f1/$f3/...), which the generic MIPS assembler
        # otherwise rejects ("float register should be even").
        run: |
          mipsel-linux-gnu-gcc -nostdlib -static -Ttext=0x08900000 \
            -march=r4000 -mabi=32 -mfp32 -Ibuild -o build/microtest_a.elf build/microtest_a.c

      - name: Generate synthetic microtest C source (Gate B — Allegrex extensions)
        run: python tools/gen_microtest.py build/microtest_b.c 2 --groups allegrex

      - name: Compile MIPS microtest ELF (Gate B, -march=r4000)
        # -march=r4000 is a conservative base MIPS ISA sufficient for function
        # prologue, lui/ori, mult/multu, mfhi/mflo, general setup, and explicit
        # syscall termination. Every Allegrex instruction-under-test is emitted
        # as a raw .word by gen_microtest.py, so no assembler ISA extension is
        # trusted for their encoding. No PSPSDK required.
        run: |
          mipsel-linux-gnu-gcc -nostdlib -static -Ttext=0x08900000 \
            -march=r4000 -mabi=32 -Ibuild -o build/microtest_b.elf build/microtest_b.c

      - name: Create dummy init trace for interpreter
        run: echo "# init r29=0x09f00000" > build/init.trace

      - name: Generate golden oracle trace (Gate A)
        run: |
          mkdir -p build/verify/gold
          SR_PPM_DUMP=build/verify/gold/frame_0001.ppm ./build/run_elf build/microtest_a.elf build/init.trace build/microtest_a.trace

      - name: Run recompiler codegen gate (Gate A — compile and verify MIPS-to-C translation)
        run: |
          mkdir -p build/verify/snap
          SR_PPM_DUMP=build/verify/snap/frame_0001.ppm CC=gcc python tools/codegen_gate.py build/microtest_a.elf build/microtest_a.trace build/verify

      - name: Generate golden oracle trace (Gate B)
        run: |
          mkdir -p build/verify/gold
          SR_PPM_DUMP=build/verify/gold/frame_0002.ppm ./build/run_elf build/microtest_b.elf build/init.trace build/microtest_b.trace

      - name: Run recompiler codegen gate (Gate B — Allegrex extensions)
        run: |
          mkdir -p build/verify/snap
          SR_PPM_DUMP=build/verify/snap/frame_0002.ppm CC=gcc python tools/codegen_gate.py build/microtest_b.elf build/microtest_b.trace build/verify

      - name: Run synthetic framebuffer-memory parity checks (A/B framebuffer diffs)
        run: |
          python tools/ppmdiff.py --threshold 3 build/verify/snap build/verify/gold
          python -c "import json; r=json.load(open('visual_regression_report.json')); exit(1 if r['summary']['failed_frames'] > 0 else 0)"

  windows_runtime:
    name: Windows runtime compile gate
    runs-on: windows-2022
    # Runs alongside the Linux gates rather than after them: it is the longest job
    # (~6.5 min), and waiting for python_tools/native_tools put ~2.5 min on every
    # PR's critical path. A Linux failure still fails ci_required; the Windows run
    # is then merely redundant, which costs nothing on a public repository.
    needs: [classify, hygiene, public_export]
    if: >-
      ${{ always() && needs.classify.result == 'success' && needs.hygiene.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.classify.outputs.allow_substantive == 'true' &&
          needs.classify.outputs.run_windows == 'true' }}
    # The gates are split into parallel matrix parts of comparable length (#694),
    # measured on hosted runners: the serial job took ~16 minutes, of which ~1.5
    # is shared setup. Every part repeats the cheap setup and the runtime-object
    # compile gate; each other step runs in exactly one part, and steps that
    # depend on one another (the staged smoke on the production smoke) share it.
    # tools/test_public_ci_wiring.py pins that every gate the serial job ran still
    # runs in exactly one part. needs.windows_runtime.result aggregates all parts.
    #   smoke:     production pipeline, AOT-gap, staged smoke, player, UI, display
    #   ladder:    full platform ladder
    #   routes:    profile-zero production routes, native core tests
    #   selftests: cosimulation + mutants, scheduler, dispatch, FP, strbuf, HLE thread
    #   fuzz:      synthetic VFPU fuzzer build
    strategy:
      fail-fast: false
      matrix:
        part: [smoke, ladder, routes, selftests, fuzz]
    timeout-minutes: 25
    # This job's MSYS2 shell has no git on PATH, so the Makefile cannot resolve a
    # revision here; it used to log a raw `process_begin: CreateProcess(NULL, git
    # rev-parse HEAD, ...) failed` and then build every binary of this job with an
    # EMPTY identity (flight recorder build_id, #532). Forward the revision the
    # checkout actually contains -- actions/checkout resolves the triggering ref,
    # whose sha is github.sha -- so a Windows-built binary records its real
    # identity and the Makefile never has to reach for git. The Linux jobs run
    # with git on PATH and resolve the same revision themselves.
    env:
      SR_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # Keep the toolchain dependency install explicit.  Do not cache
          # compiled runtime objects: Make's content-addressed invalidation and
          # shader freshness checks must remain authoritative.
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader

      # Windows toolchain contract (docs/CI.md): repository tools run under the
      # MSYS2 UCRT64 CPython installed above, selected by the msys2 shell's PATH
      # order -- never the runner's Windows CPython. Stages that need `pwsh` opt
      # into the inherited Windows PATH explicitly (MSYS2_PATH_TYPE: inherit) and
      # assert `command -v pwsh` themselves. This step makes both facts explicit
      # instead of leaving them to PATH order.
      - name: Pin the Windows Python toolchain (MSYS2 UCRT64 CPython)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # Compare against MSYS2's own UCRT64 prefix wherever the runner installed
          # MSYS2 (for example under the runner temp directory), never a fixed drive.
          prefix="$(cygpath -m /ucrt64)"
          py="$(python -c 'import sys; print(sys.executable.replace(chr(92), chr(47)))')"
          echo "python -> $py (expected under $prefix)"
          case "$py" in
            /ucrt64/*|"$prefix"/*) ;;
            *) echo "expected the MSYS2 UCRT64 python under $prefix, got $py" >&2; exit 1 ;;
          esac
          python --version

      - name: Verify default and override compiler resolution
        shell: msys2 {0}
        run: |
          set -euo pipefail
          unset CC

          default_info="$(
            mingw32-make --no-print-directory \
              GAME_NAME=ci BUILD_DIR=build/compiler-probe VULKAN_SDK=/ucrt64 \
              compiler-info
          )"
          printf '%s\n' "$default_info"
          grep -Fx 'CC=gcc' <<<"$default_info"
          grep -Fx 'CC_ORIGIN=file' <<<"$default_info"
          command -v gcc
          gcc --version

          override_info="$(
            mingw32-make --no-print-directory \
              GAME_NAME=ci BUILD_DIR=build/compiler-probe VULKAN_SDK=/ucrt64 \
              CC=clang compiler-info
          )"
          printf '%s\n' "$override_info"
          grep -Fx 'CC=clang' <<<"$override_info"
          grep -Fx 'CC_ORIGIN=command line' <<<"$override_info"

      # -j2 uses both vCPUs of the hosted runner for these independent object
      # compiles (#694); the gate is the same target and the same objects.
      - name: Compile Windows runtime objects through the default compiler path
        shell: msys2 {0}
        run: |
          unset CC
          mingw32-make -j2 GAME_NAME=ci BUILD_DIR=build/windows-runtime \
            VULKAN_SDK=/ucrt64 runtime-objects

      # This is the executable production-path gate. It generates a public
      # PSP-shaped PRX, runs the normal loader/import/analyzer/codegen pipeline,
      # links every production runtime object with the real driver, and reaches
      # a real HLE NID through the scheduler before checking the guest sentinel.
      - name: Build and run full production pipeline smoke
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        # The ordinary compile target invokes the repository's PowerShell 7.4
        # asset-copy script after linking. Keep the broader Windows PATH scoped
        # to this step so MSYS2 can resolve the runner's `pwsh` without changing
        # tool selection in the other UCRT64 compile gates.
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke

      # AOT-gap seam proof on the same source-owned fixture: the helper is
      # omitted from native emission at build time, so region A reaches it via
      # the ordinary production dispatch() path. Generated executable-span
      # ownership gates interpretation, and the run must hand off to registered
      # AOT region B before the final production-driver assertion can pass.
      - name: Build and run AOT-gap dispatch-seam smoke
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke-gap

      - name: Run native core test suite on Windows
        if: matrix.part == 'routes'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mingw32-make --no-print-directory CC=gcc native-core-tests

      # Hosted build/link gate for the public player/launcher (#294). Link-only
      # proof: the player's GUI smoke remains a developer/display gate.
      - name: Build and link the native player
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player-ui-tests

      - name: Run native player UI regressions headlessly on Windows
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player-ui-regressions

      # Run the same smoke with the executable staged outside its build tree
      # (#294): a launcher/staging path bug must fail in CI, not only in the
      # build-tree spelling. Depends on the production-smoke step above; the
      # rebuild underneath is incremental, so this re-runs only generate/verify/run.
      - name: Stage and run production smoke outside its build directory
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke-staged

      # The complete source-owned ladder matrix (#294), superset of the former
      # ladder-fs-only step: zero/reloc/gap/sched/fpu/fs/fs-negative/title2/
      # title2-negative.
      - name: Build and run the full platform ladder
        if: matrix.part == 'ladder'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 platform-ladder

      # The two #309 manifests use this manifest-driven guest -> ProgramImage ->
      # AOT package -> production runtime route (#557). Hosted runners carry no
      # PSPDEV/PSPSDK, so the gate executes the route from the committed fixture
      # in fixtures/profile_zero/prebuilt; on hosts with PSPDEV it additionally
      # rebuilds the fixture and fails if any byte differs. Its only remaining
      # SKIP is a missing host multimedia dependency (Vulkan SDK / SDL3), printed
      # with the reason.
      - name: Build and run profile-zero production routes
        if: matrix.part == 'routes'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 profile-zero-e2e

      # Presentation path on a source-owned guest: fill the PSP framebuffer, hand
      # it to sceDisplaySetFrameBuf and wait for vblank, once per frame. The other
      # smokes prove compute and the dispatch seam but never reach the display
      # source, so a scheduler change that stops delivering vblanks to a guest
      # whose only wait is a vblank wait was invisible to every hosted gate. Runs
      # headless (--sched), then through the normal --sched --gui route with
      # SR_VIDEO=offscreen: the assertions are the guest-visible framebuffer
      # word and accepted offscreen-present ordering, so no display is required.
      - name: Build and run display presentation smoke
        if: matrix.part == 'smoke'
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 display-smoke-run

      # AOT <-> interpreter differential over the same source-owned guest bytes.
      # One pipeline run produces both execution lanes; the comparator diffs the
      # canonical instruction trace, the ordered guest writes, the memory window
      # and the architectural state vector, and reports the FIRST difference.
      # Without this in CI, the only thing standing between a codegen semantic
      # regression and a title run is a developer remembering to run it.
      - name: Build and run AOT/interpreter cosimulation gate
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 cosim-selftest

      # A comparator that cannot fail proves nothing. Each mutant is a semantic
      # defect applied to a COPY of the interpreter under the ignored build tree;
      # the gate must fail for every one, and a mutant that only breaks the build
      # is rejected as INVALID rather than counted as a kill.
      - name: Prove the cosimulation comparator is load-bearing
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 cosim-mutants

      - name: Build and run scheduler selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 sched-selftest

      # The executable proof that a title binding acts only where its own
      # configuration names it. Same three-configuration shape as
      # sched-selftest -- generic, fixture-a, fixture-b -- but over dispatch()
      # rather than the scheduler. Without it in CI, the isolation claim rests
      # on a gate that only ever ran on a developer's machine.
      - name: Build and run dispatch isolation selftest matrix
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 dispatch-isolation-selftest

      - name: Build and run portable FPU/VFPU conversion selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 fp-convert-selftest

      - name: Build and run strbuf checked-append formatting selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 strbuf-selftest

      # hle-thread-selftest compiles src/rt/hle.c directly, so it is the only
      # gate that catches a target drifting out of step with hle.c's own
      # dependencies. It was absent here, and silently stopped building when
      # #315 added the ATRAC3+ bridge; that failure then hid #326 breaking the
      # same target again. Building it in CI is what stops the third recurrence.
      - name: Build and run HLE thread selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime
          CC=gcc VULKAN_SDK=/ucrt64 hle-thread-selftest

      # The flash0: font device contract (hle_thread_selftest --flash0-font over synthetic
      # PGFs) is driven by tools/test_flash0_font.py, which skips wherever mingw32-make is
      # absent; before this step no hosted job ran it at all.
      - name: Build and run flash0 font device selftest
        if: matrix.part == 'selftests'
        shell: msys2 {0}
        run: >-
          PYTHONPATH=tools python -m unittest -v test_flash0_font

      - name: Build and run synthetic VFPU fuzzer
        if: matrix.part == 'fuzz'
        shell: msys2 {0}
        run: |
          python tools/vfpu_fuzz_gen.py --synthetic build/windows-runtime/vfpu_fuzz_cases.h
          printf 'void f_00304290(void *s) { (void)s; }\n' > build/windows-runtime/ci_recomp.c
          touch build/windows-runtime/ci_recomp_funcs.h
          touch build/windows-runtime/.recomp-trace-0
          mingw32-make GAME_NAME=ci BUILD_DIR=build/windows-runtime \
            VFPU_FUZZ_PREGENERATED=1 CC=gcc VULKAN_SDK=/ucrt64 -j4 vfpu_fuzz_build

  main_smoke:
    name: Main integration smoke
    runs-on: ubuntu-24.04
    needs: [classify, hygiene, public_export]
    if: >-
      ${{ always() && needs.classify.result == 'success' && needs.hygiene.result == 'success' &&
          needs.public_export.result == 'success' &&
          needs.classify.outputs.run_main_smoke == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run compact import/publication smoke
        # Publication audit is part of the always-present hygiene job; this
        # smoke adds a fresh main-branch import gate without repeating it.
        run: python tools/import_audit_gate.py

      - name: Run provenance record and disposition gap check
        # #355: ratchets disposition gaps for upstream-derived production paths.
        run: python tools/provenance_record_gap.py --check

  ci_required:
    name: CI required
    runs-on: ubuntu-24.04
    needs: [classify, hygiene, public_export, markdown, python_tools, native_tools, windows_runtime, main_smoke]
    if: ${{ always() }}
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      HYGIENE_RESULT: ${{ needs.hygiene.result }}
      PUBLIC_EXPORT_RESULT: ${{ needs.public_export.result }}
      MARKDOWN_RESULT: ${{ needs.markdown.result }}
      PYTHON_RESULT: ${{ needs.python_tools.result }}
      NATIVE_RESULT: ${{ needs.native_tools.result }}
      WINDOWS_RESULT: ${{ needs.windows_runtime.result }}
      MAIN_SMOKE_RESULT: ${{ needs.main_smoke.result }}
      RUN_MARKDOWN: ${{ needs.classify.outputs.run_markdown }}
      RUN_PYTHON: ${{ needs.classify.outputs.run_python }}
      RUN_NATIVE: ${{ needs.classify.outputs.run_native }}
      RUN_WINDOWS: ${{ needs.classify.outputs.run_windows }}
      RUN_MAIN_SMOKE: ${{ needs.classify.outputs.run_main_smoke }}
      ALLOW_SUBSTANTIVE: ${{ needs.classify.outputs.allow_substantive }}
      DRAFT: ${{ needs.classify.outputs.draft }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check applicable gate results
        run: python tools/ci_required.py
