name: Trusted CI verdict

# The merge-path CI gate (#373, #364). It posts one commit status, "Trusted CI
# verdict", on a pull request's exact head, and the main ruleset is meant to
# require that status (plus CodeQL) instead of the contexts below.
#
# Why: CI, OSV-Scanner and Dependency Review are pull_request workflows. Their
# definitions come from the pull request's merge commit, so a candidate can keep
# a required job's name and make it `exit 0`, or add a workflow with a job of the
# same name. GitHub matches a required check by name plus the GitHub Actions
# integration, which both jobs share. This workflow runs only the default
# branch's copy (pull_request_target and workflow_run always do) and judges the
# candidate's results with tools/ci_trust_verdict.py, which:
#   * refuses a head that changes a workflow, an action or a CI tool, unless a
#     maintainer applied the ci-change-approved label after that head arrived,
#     or the label was carried because every protected file is byte-identical
#     to the approved head's (the approval jobs below);
#   * requires each intended job to exist once, to succeed, and to come from
#     the intended workflow path and event at exactly this head;
#   * refuses stale heads, results for other SHAs or pull requests, and any
#     other producer of an intended context.
#
# Every line below assumes a hostile pull request author:
#   * the checkout is the DEFAULT BRANCH, never base.ref or the head;
#   * the candidate's objects are fetched as data and read with git ls-tree and
#     git cat-file only. Nothing from the candidate is checked out or executed;
#   * no pull request title, body or branch name is used. Event values go
#     through env: and are validated before use;
#   * each job gets only the permissions it needs, and actions are pinned to
#     commit SHAs.
#
# The verdict job's own check run is named "Compute trusted CI verdict" on
# purpose: the required context is the commit status alone, and the verifier
# refuses any check run that uses the status's name.
#
# Re-triggers: a new head, a label change, and the completion of CI, which is
# the producer that finishes last (on all 181 heads measured on 2026-11-04/05).
# A run started when OSV-Scanner or Dependency Review finished only re-posted
# "pending" and held the head's concurrency group ahead of the run CI starts.
# When one of them, or the provenance attestation workflow (its verifier
# reserves that name in every other workflow, so it is never listed here),
# finishes after CI, the verdict stays pending, never success: dispatch this
# workflow by hand (docs/CI.md, "Trusted CI verdict"). The draft/ready
# transition is not a re-trigger here: CI runs on both (ci.yml), and the
# completion of that run re-judges the head. The verifier reads the pull
# request's draft state then and never judges a Draft green (DRAFT_LIGHT_CI).
# Every label event re-judges, whatever the label: a newer run in this head's
# concurrency group replaces a pending one, so a run that judged nothing could
# leave an older verdict standing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to judge again, by number.
        required: true
        type: string

concurrency:
  # One verdict at a time per head, never cancelled mid-post. A newer pending
  # run replaces an older pending one, and every run reads GitHub's state afresh.
  group: trusted-ci-verdict-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.pull_request_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  approval:
    # The label approves one reviewed head, and the same CI-relevant bytes at a
    # later head. Both halves run the default branch's tools/ci_trust_verdict.py
    # on the candidate's objects as data (docs/CI.md, "Carried approval"):
    #   * labeled: when a user with write access applied the label and the head
    #     is still the one the event named, hash the head's protected paths;
    #   * synchronize: keep the label only if that hash, recomputed for the new
    #     head, equals one recorded at the previous head, then hash again for
    #     the new head;
    #   * reopened (it may carry commits pushed while closed), or any error,
    #     missing record or mismatch: remove the label, as before.
    # The hash is recorded by the next job's name, below.
    name: Record, carry or withdraw CI-change approval
    if: >-
      ${{ github.event_name == 'pull_request_target' &&
          ((github.event.action == 'labeled' && github.event.label.name == 'ci-change-approved') ||
           ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'ci-change-approved'))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    outputs:
      digest: ${{ steps.record.outputs.digest || steps.carry.outputs.digest }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Hash the labelled head
        id: record
        if: ${{ github.event.action == 'labeled' }}
        # Not recorded is not an error: a label from a user without write
        # access, or on a head that already moved, records nothing and the
        # verdict then accepts only a label applied after the head arrived.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERDICT_READ_TOKEN: ${{ secrets.VERDICT_READ_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "pull request number is not numeric" >&2; exit 1 ;;
          esac
          python tools/ci_trust_verdict.py --repository "${GITHUB_REPOSITORY}" --default-branch "${DEFAULT_BRANCH}" \
            --approval record --pull-request "${PR_NUMBER}" --head-sha "${HEAD_SHA}"

      - name: Carry the approval to the new head
        id: carry
        if: ${{ github.event.action == 'synchronize' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERDICT_READ_TOKEN: ${{ secrets.VERDICT_READ_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "pull request number is not numeric" >&2; exit 1 ;;
          esac
          python tools/ci_trust_verdict.py --repository "${GITHUB_REPOSITORY}" --default-branch "${DEFAULT_BRANCH}" \
            --approval carry --pull-request "${PR_NUMBER}" --head-sha "${HEAD_SHA}" --before-sha "${BEFORE_SHA}"

      - name: Remove the ci-change-approved label
        # Every push or reopen that was not carried, whatever the reason: the
        # steps above succeeding is the only way to keep the label.
        if: ${{ !cancelled() && github.event.action != 'labeled' && steps.carry.outputs.digest == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "pull request number is not numeric" >&2; exit 1 ;;
          esac
          labels="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels"
          if ! gh api --method DELETE "${labels}/ci-change-approved" > /dev/null; then
            # Already gone (removed by hand meanwhile) is fine; still there is not.
            if gh api "${labels}" --jq '.[].name' | grep -qx 'ci-change-approved'; then
              echo "could not remove ci-change-approved; no verdict for this head" >&2
              exit 1
            fi
          fi
          echo "ci-change-approved removed from #${PR_NUMBER}: a maintainer re-applies it after reviewing the new head"

  approval_record:
    # The record itself. The pull request number and the digest are in this
    # job's NAME, and the verifier (tools/ci_trust_verdict.py, record_digests)
    # reads them back only from a successful job of a pull_request_target run
    # of this workflow at the exact head, for that pull request. GitHub takes
    # a pull_request_target run's workflow from the pull request's BASE branch,
    # which is the default branch only for a pull request that targets it; the
    # verifier ignores runs reported for another base and never carries for a
    # pull request that was retargeted. A pull request cannot name such a job.
    # The digest is a SHA-256 hex string the previous job's tool printed.
    name: CI approval record v1 pr${{ github.event.pull_request.number }} ${{ needs.approval.outputs.digest }}
    needs: [approval]
    if: ${{ needs.approval.outputs.digest != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: State what is recorded
        run: echo "Protected CI content of this head is approved; the digest is in this job's name."

  verdict:
    name: Compute trusted CI verdict
    needs: [approval, approval_record]
    # Only heads proposed for the default branch, which is the only branch the
    # ruleset protects. workflow_run runs of push or schedule events have no
    # pull request to judge; the verifier also finds none and posts nothing.
    # A cancelled first CI attempt is a head superseded by a newer push (ci.yml
    # cancels in progress per pull request): skipped here, it takes no runner.
    # If it was the current head's CI, the status stays pending (never
    # mergeable) until a re-run, attempt 2 or later, which is judged as usual.
    if: >-
      ${{ always() &&
          (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
          (needs.approval_record.result == 'success' || needs.approval_record.result == 'skipped') &&
          ((github.event_name == 'pull_request_target' &&
            github.event.pull_request.base.ref == github.event.repository.default_branch) ||
           (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
            !(github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.run_attempt == 1)) ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history: the verifier needs the merge base of the candidate.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      # The verifier fetches refs/pull/N/head into a private ref as objects
      # only, with no credentials, and posts the status itself.
      # VERDICT_READ_TOKEN is the maintainer's read-only token for this
      # repository: the verifier's reads use it, so they draw on that
      # account's API budget rather than the GITHUB_TOKEN budget every
      # workflow shares. The status is still posted with GITHUB_TOKEN. When the
      # secret is absent (Dependabot runs) every request uses GITHUB_TOKEN.
      - name: Judge the head and post the verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERDICT_READ_TOKEN: ${{ secrets.VERDICT_READ_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(--repository "${GITHUB_REPOSITORY}" --default-branch "${DEFAULT_BRANCH}"
                --post --target-url "${RUN_URL}" --summary "${GITHUB_STEP_SUMMARY}")
          if [ -n "${PR_NUMBER}" ]; then
            case "${PR_NUMBER}" in
              *[!0-9]*) echo "pull request number is not numeric" >&2; exit 1 ;;
            esac
            args+=(--pull-request "${PR_NUMBER}")
          fi
          if [ -n "${HEAD_SHA}" ]; then
            args+=(--head-sha "${HEAD_SHA}")
          fi
          python tools/ci_trust_verdict.py "${args[@]}"
