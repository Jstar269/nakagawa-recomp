name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: This request contains no proprietary game data, secrets, or private paths.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing a band-aid.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Runtime
        - Pipeline tools
        - Reference interpreter
        - Dashboard
        - Build system
        - Documentation
        - Multiple or unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: What observable result would show that the request is complete?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
